<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gpxer — GPX Route Builder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  /* ---------- house tokens ---------- */
  :root {
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    --accent: #0891b2;
    --accent-deep: #0e7490;
    --accent-ink: #ffffff;

    --r-ctl: 3px;
    --r-card: 4px;
    --sheen: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(0 0 0 / .08));

    /* light */
    --bg: #fafafa;
    --surface: #f1f1f3;
    --surface-2: #e9e9ed;
    --text: #131316;
    --text-2: #55555e;
    --muted: #9b9ba6;
    --line: #e4e4e9;
    --accent-text: #0e7490;
    --accent-soft: #e2f0f4;

    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d;
      --surface: #17171a;
      --surface-2: #212126;
      --text: #f2f2f4;
      --text-2: #a3a3ad;
      --muted: #5b5b66;
      --line: #26262c;
      --accent-text: #3aa8c4;
      --accent-soft: #0c2229;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #17171a;
    --surface-2: #212126;
    --text: #f2f2f4;
    --text-2: #a3a3ad;
    --muted: #5b5b66;
    --line: #26262c;
    --accent-text: #3aa8c4;
    --accent-soft: #0c2229;
  }

  /* app tokens — marker colors are map content, fixed across modes */
  :root {
    --waypoint: #16a34a;
    --track: #0891b2;
    --danger: #b91c1c;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.55;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }

  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ─── Sidebar ─── */
  .sidebar {
    width: 360px;
    min-width: 360px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    z-index: 1000;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 14px 16px;
    background: var(--accent-soft);
  }

  .logo {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--text);
  }

  /* ─── File name input ─── */
  .file-section {
    padding: 16px 16px 0;
  }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 6px;
  }

  .file-input-wrap {
    display: flex;
    align-items: center;
    background: var(--surface);
    border-radius: var(--r-ctl);
  }
  .file-input-wrap:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .file-input-wrap input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    padding: 9px 12px;
    min-height: 38px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
  }
  .file-input-wrap input::placeholder { color: var(--muted); }

  .file-ext {
    padding: 9px 12px 9px 0;
    color: var(--text-2);
    font-family: var(--font-mono);
    font-size: 13px;
    user-select: none;
  }

  /* ─── Mode toggle ─── */
  .mode-section {
    padding: 12px 16px;
  }

  .mode-toggle {
    display: flex;
    background: var(--surface);
    border-radius: var(--r-ctl);
    padding: 3px;
    gap: 3px;
  }

  .mode-btn {
    flex: 1;
    padding: 7px 10px;
    min-height: 32px;
    border: none;
    border-radius: var(--r-ctl);
    background: none;
    color: var(--text-2);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .mode-btn .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }

  .mode-btn[data-mode="waypoint"] .dot { border: 1.5px solid var(--waypoint); }
  .mode-btn[data-mode="track"] .dot { border: 1.5px solid var(--track); }

  .mode-btn.active {
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: 600;
  }
  .mode-btn[data-mode="waypoint"].active .dot { background: var(--waypoint); }
  .mode-btn[data-mode="track"].active .dot { background: var(--track); }

  /* ─── Panels ─── */
  .panels {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--surface-2) transparent;
  }

  .panel-header {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .panel-header:hover { background: var(--surface); }

  .panel-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-count {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
  }

  .panel-chevron {
    color: var(--muted);
    font-size: 12px;
  }
  .panel.collapsed .panel-chevron { transform: rotate(-90deg); }
  .panel.collapsed .panel-body { display: none; }

  .panel-body {
    padding: 0 16px 14px;
  }

  /* ─── Track name ─── */
  .track-name-input {
    width: 100%;
    background: var(--surface);
    border: none;
    border-radius: var(--r-ctl);
    padding: 9px 12px;
    min-height: 38px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .track-name-input::placeholder { color: var(--muted); }

  /* ─── Items ─── */
  .item-list { display: flex; flex-direction: column; gap: 6px; }

  .item {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 8px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-start;
    position: relative;
  }

  .item-index {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    min-width: 20px;
    padding-top: 4px;
    text-align: right;
    user-select: none;
  }

  .item-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

  .item-field {
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    padding: 2px 0;
    width: 100%;
  }
  .item-field::placeholder { color: var(--muted); }

  .item-coords {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-2);
    padding-top: 2px;
  }

  .item-actions {
    display: flex;
    gap: 2px;
    align-items: flex-start;
    margin-left: auto;
  }

  .item-btn {
    border: none;
    background: none;
    color: var(--text-2);
    cursor: pointer;
    border-radius: var(--r-ctl);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 5px;
  }
  .item-btn:hover { background: var(--surface-2); color: var(--text); }
  .item-btn.delete:hover { background: var(--surface-2); color: var(--danger); }

  .empty-msg {
    font-size: 12px;
    color: var(--text-2);
    padding: 10px 0;
  }

  /* ─── Export ─── */
  .sidebar-footer {
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .export-btn {
    width: 100%;
    padding: 9px 16px;
    min-height: 44px;
    background-color: var(--accent);
    background-image: var(--sheen);
    color: var(--accent-ink);
    border: none;
    border-radius: var(--r-ctl);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .export-btn:hover { background-color: var(--accent-deep); }
  .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .clear-btn {
    width: 100%;
    padding: 9px 16px;
    min-height: 38px;
    background: var(--surface);
    color: var(--text);
    border: none;
    border-radius: var(--r-ctl);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .clear-btn:hover { background: var(--surface-2); }

  /* ─── Map ─── */
  .map-container {
    flex: 1;
    position: relative;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  /* Leaflet chrome overrides — flat, tokenized */
  .leaflet-container { background: var(--bg); }
  .leaflet-bar {
    border: none !important;
    box-shadow: none !important;
  }
  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text-2) !important;
    border-bottom: 1px solid var(--line) !important;
  }
  .leaflet-control-zoom a:last-child { border-bottom: none !important; }
  .leaflet-control-zoom a:hover {
    background: var(--surface-2) !important;
    color: var(--text) !important;
  }
  .leaflet-control-attribution {
    background: var(--surface) !important;
    color: var(--text-2) !important;
    font-family: var(--font-mono) !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: var(--accent-text) !important; }

  /* Map crosshair cursor */
  .map-crosshair .leaflet-grab { cursor: crosshair !important; }
  .map-crosshair .leaflet-dragging .leaflet-grab { cursor: grabbing !important; }

  /* ─── Coord display on map ─── */
  .coord-display {
    position: absolute;
    bottom: 28px;
    left: 12px;
    z-index: 999;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-2);
    background: var(--surface);
    padding: 5px 10px;
    border-radius: var(--r-ctl);
    pointer-events: none;
  }

  .mode-indicator {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: var(--r-ctl);
    background: var(--surface);
    color: var(--text-2);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mode-indicator .ind-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .mode-indicator.waypoint-mode .ind-dot { background: var(--waypoint); }
  .mode-indicator.track-mode .ind-dot { background: var(--track); }

  /* ─── Custom markers (map content) ─── */
  .waypoint-marker {
    width: 24px !important; height: 24px !important;
    margin-left: -12px !important; margin-top: -12px !important;
  }
  .waypoint-marker-inner {
    width: 24px; height: 24px;
    background: var(--waypoint);
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 700;
    color: #fff;
  }

  .track-marker {
    width: 14px !important; height: 14px !important;
    margin-left: -7px !important; margin-top: -7px !important;
  }
  .track-marker-inner {
    width: 14px; height: 14px;
    background: var(--track);
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: var(--accent-soft);
    color: var(--accent-text);
    padding: 10px 16px;
    border-radius: var(--r-card);
    font-family: var(--font-mono);
    font-size: 12px;
    display: none;
    pointer-events: none;
  }
  .toast.show { display: block; }

  /* ─── Signature ─── */
  .b-glyph {
    position: fixed;
    bottom: 34px;
    right: 10px;
    z-index: 1100;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 13px;
    line-height: 1;
    color: var(--text-2);
    background: var(--surface);
    border-radius: var(--r-ctl);
    padding: 6px 8px;
    text-decoration: none;
  }
  .b-glyph:hover { color: var(--accent-text); }

  /* ─── Scrollbar ─── */
  .panels::-webkit-scrollbar { width: 5px; }
  .panels::-webkit-scrollbar-track { background: transparent; }
  .panels::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">gpxer</div>
  </div>

  <div class="file-section">
    <label class="field-label">File Name</label>
    <div class="file-input-wrap">
      <input type="text" id="fileName" placeholder="my-route" spellcheck="false" />
      <span class="file-ext">.gpx</span>
    </div>
  </div>

  <div class="mode-section">
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="waypoint" onclick="setMode('waypoint')">
        <span class="dot"></span> Waypoint
      </button>
      <button class="mode-btn" data-mode="track" onclick="setMode('track')">
        <span class="dot"></span> Track Point
      </button>
    </div>
  </div>

  <div class="panels">
    <div class="panel" id="waypointPanel">
      <div class="panel-header" onclick="togglePanel('waypointPanel')">
        <div class="panel-title">
          Waypoints <span class="panel-count" id="wptCount">0</span>
        </div>
        <span class="panel-chevron">▾</span>
      </div>
      <div class="panel-body">
        <div class="item-list" id="waypointList">
          <div class="empty-msg">0 waypoints. Click the map.</div>
        </div>
      </div>
    </div>

    <div class="panel" id="trackPanel">
      <div class="panel-header" onclick="togglePanel('trackPanel')">
        <div class="panel-title">
          Track <span class="panel-count" id="trkCount">0</span>
        </div>
        <span class="panel-chevron">▾</span>
      </div>
      <div class="panel-body">
        <input type="text" class="track-name-input" id="trackName" placeholder="Track Name" spellcheck="false" />
        <div class="item-list" id="trackList">
          <div class="empty-msg">0 track points. Click the map.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="export-btn" id="exportBtn" onclick="exportGPX()">Export GPX</button>
    <button class="clear-btn" onclick="clearAll()">Clear All</button>
  </div>
</div>

<div class="map-container">
  <div class="mode-indicator waypoint-mode" id="modeIndicator">
    <span class="ind-dot"></span>
    <span id="modeText">Placing waypoints</span>
  </div>
  <div id="map" class="map-crosshair"></div>
  <div class="coord-display" id="coordDisplay">—</div>
</div>

<div class="toast" id="toast"></div>

<a class="b-glyph" href="https://index.baileys.app" title="A Bailey App">b.</a>

<script>
// ─── State ───
let mode = 'waypoint';
let waypoints = [];
let trackpoints = [];
let waypointMarkers = [];
let trackMarkers = [];
let trackLine = null;
let dragIndex = null;

// ─── Map setup ───
const map = L.map('map', {
  zoomControl: true,
  attributionControl: true
}).setView([22.32, 114.17], 15);

// Basemap follows the app's color scheme (tiles are content; light tiles in
// light mode, dark tiles in dark mode). Honors a data-theme override on <html>.
const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');

function tileUrl() {
  const override = document.documentElement.getAttribute('data-theme');
  const dark = (override === 'dark' || override === 'light') ? override === 'dark' : darkScheme.matches;
  return 'https://{s}.basemaps.cartocdn.com/' + (dark ? 'dark_all' : 'light_all') + '/{z}/{x}/{y}{r}.png';
}

const tiles = L.tileLayer(tileUrl(), {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

darkScheme.addEventListener('change', () => tiles.setUrl(tileUrl()));

// ─── Map events ───
map.on('mousemove', (e) => {
  document.getElementById('coordDisplay').textContent =
    `${e.latlng.lat.toFixed(7)}, ${e.latlng.lng.toFixed(7)}`;
});

map.on('click', (e) => {
  const { lat, lng } = e.latlng;
  if (mode === 'waypoint') {
    addWaypoint(lat, lng);
  } else {
    addTrackPoint(lat, lng);
  }
});

// ─── Mode ───
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  const indicator = document.getElementById('modeIndicator');
  indicator.className = 'mode-indicator ' + (m === 'waypoint' ? 'waypoint-mode' : 'track-mode');
  document.getElementById('modeText').textContent =
    m === 'waypoint' ? 'Placing waypoints' : 'Placing track points';
}

// ─── Waypoints ───
function addWaypoint(lat, lng) {
  const wpt = { lat, lng, name: '', desc: '' };
  waypoints.push(wpt);

  const icon = L.divIcon({
    className: 'waypoint-marker',
    html: `<div class="waypoint-marker-inner">${waypoints.length}</div>`
  });
  const marker = L.marker([lat, lng], { icon, draggable: true }).addTo(map);
  marker.on('dragend', (e) => {
    const pos = e.target.getLatLng();
    const idx = waypointMarkers.indexOf(marker);
    waypoints[idx].lat = pos.lat;
    waypoints[idx].lng = pos.lng;
    renderWaypoints();
  });
  waypointMarkers.push(marker);
  renderWaypoints();
}

function removeWaypoint(idx) {
  waypoints.splice(idx, 1);
  map.removeLayer(waypointMarkers[idx]);
  waypointMarkers.splice(idx, 1);
  // Renumber markers
  waypointMarkers.forEach((m, i) => {
    m.setIcon(L.divIcon({
      className: 'waypoint-marker',
      html: `<div class="waypoint-marker-inner">${i + 1}</div>`
    }));
  });
  renderWaypoints();
}

function renderWaypoints() {
  document.getElementById('wptCount').textContent = waypoints.length;
  const list = document.getElementById('waypointList');

  if (waypoints.length === 0) {
    list.innerHTML = '<div class="empty-msg">0 waypoints. Click the map.</div>';
    return;
  }

  list.innerHTML = waypoints.map((w, i) => `
    <div class="item">
      <div class="item-index">${i + 1}</div>
      <div class="item-fields">
        <input class="item-field" placeholder="Name" value="${esc(w.name)}"
          oninput="waypoints[${i}].name = this.value" spellcheck="false" />
        <input class="item-field" placeholder="Description" value="${esc(w.desc)}"
          oninput="waypoints[${i}].desc = this.value" spellcheck="false" />
        <div class="item-coords">${w.lat.toFixed(7)}, ${w.lng.toFixed(7)}</div>
      </div>
      <div class="item-actions">
        <button class="item-btn delete" onclick="removeWaypoint(${i})" title="Delete">Delete</button>
      </div>
    </div>
  `).join('');
}

// ─── Track Points ───
function addTrackPoint(lat, lng) {
  trackpoints.push({ lat, lng });

  const icon = L.divIcon({
    className: 'track-marker',
    html: '<div class="track-marker-inner"></div>'
  });
  const marker = L.marker([lat, lng], { icon, draggable: true }).addTo(map);
  marker.on('dragend', (e) => {
    const pos = e.target.getLatLng();
    const idx = trackMarkers.indexOf(marker);
    trackpoints[idx].lat = pos.lat;
    trackpoints[idx].lng = pos.lng;
    updateTrackLine();
    renderTrackPoints();
  });
  trackMarkers.push(marker);
  updateTrackLine();
  renderTrackPoints();
}

function removeTrackPoint(idx) {
  trackpoints.splice(idx, 1);
  map.removeLayer(trackMarkers[idx]);
  trackMarkers.splice(idx, 1);
  updateTrackLine();
  renderTrackPoints();
}

function moveTrackPoint(from, to) {
  if (to < 0 || to >= trackpoints.length) return;
  const [tp] = trackpoints.splice(from, 1);
  trackpoints.splice(to, 0, tp);
  const [mk] = trackMarkers.splice(from, 1);
  trackMarkers.splice(to, 0, mk);
  updateTrackLine();
  renderTrackPoints();
}

function updateTrackLine() {
  if (trackLine) map.removeLayer(trackLine);
  if (trackpoints.length < 2) return;
  trackLine = L.polyline(
    trackpoints.map(tp => [tp.lat, tp.lng]),
    { color: '#0891b2', weight: 2.5, opacity: 0.8, dashArray: '6 4' }
  ).addTo(map);
}

function renderTrackPoints() {
  document.getElementById('trkCount').textContent = trackpoints.length;
  const list = document.getElementById('trackList');

  if (trackpoints.length === 0) {
    list.innerHTML = '<div class="empty-msg">0 track points. Click the map.</div>';
    return;
  }

  list.innerHTML = trackpoints.map((tp, i) => `
    <div class="item">
      <div class="item-index">TP${String(i + 1).padStart(3, '0')}</div>
      <div class="item-fields">
        <div class="item-coords">${tp.lat.toFixed(7)}, ${tp.lng.toFixed(7)}</div>
      </div>
      <div class="item-actions">
        <button class="item-btn" onclick="moveTrackPoint(${i}, ${i - 1})" title="Move Up">Up</button>
        <button class="item-btn" onclick="moveTrackPoint(${i}, ${i + 1})" title="Move Down">Down</button>
        <button class="item-btn delete" onclick="removeTrackPoint(${i})" title="Delete">Delete</button>
      </div>
    </div>
  `).join('');
}

// ─── Panel toggle ───
function togglePanel(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

// ─── Export ───
function exportGPX() {
  if (waypoints.length === 0 && trackpoints.length === 0) {
    showToast('Add waypoints or track points first');
    return;
  }

  const fileName = (document.getElementById('fileName').value.trim() || 'route') + '.gpx';
  const trackName = document.getElementById('trackName').value.trim() || 'Track';
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');

  let xml = `<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n`;
  xml += `<gpx xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxx="http://www.garmin.com/xmlschemas/GpxExtensions/v3" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1" creator="mapstogpx.com" version="1.1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd http://www.garmin.com/xmlschemas/GpxExtensions/v3 http://www.garmin.com/xmlschemas/GpxExtensionsv3.xsd http://www.garmin.com/xmlschemas/TrackPointExtension/v1 http://www.garmin.com/xmlschemas/TrackPointExtensionv1.xsd">\n`;
  xml += `  <metadata>\n`;
  xml += `    <link href="http://www.mapstogpx.com">\n`;
  xml += `      <text>Sverrir Sigmundarson</text>\n`;
  xml += `    </link>\n`;
  xml += `    <time>${now}</time>\n`;
  xml += `  </metadata>\n`;

  waypoints.forEach(w => {
    xml += `  <wpt lat="${w.lat}" lon="${w.lng}">\n`;
    xml += `    <name>${escXml(w.name || 'Waypoint')}</name>\n`;
    xml += `    <desc>${escXml(w.desc || '')}</desc>\n`;
    xml += `  </wpt>\n`;
  });

  if (trackpoints.length > 0) {
    xml += `<trk>\n`;
    xml += `  <name>${escXml(trackName)}</name>\n`;
    xml += `  <number>1</number>\n`;
    xml += `  <trkseg>\n`;
    trackpoints.forEach((tp, i) => {
      xml += `  <trkpt lat="${tp.lat}" lon="${tp.lng}">\n`;
      xml += `    <name>TP${String(i + 1).padStart(3, '0')}</name>\n`;
      xml += `  </trkpt>\n`;
    });
    xml += `  </trkseg>\n`;
    xml += `</trk>\n`;
  }

  xml += `</gpx>`;

  const blob = new Blob([xml], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast(`Exported ${fileName}`);
}

// ─── Clear ───
function clearAll() {
  waypoints = [];
  trackpoints = [];
  waypointMarkers.forEach(m => map.removeLayer(m));
  trackMarkers.forEach(m => map.removeLayer(m));
  waypointMarkers = [];
  trackMarkers = [];
  if (trackLine) { map.removeLayer(trackLine); trackLine = null; }
  renderWaypoints();
  renderTrackPoints();
  showToast('Cleared.');
}

// ─── Helpers ───
function esc(s) { return s.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escXml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
