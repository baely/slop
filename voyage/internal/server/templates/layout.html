{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- house tokens ---------- */
  :root {
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    --accent: #0891b2;
    --accent-deep: #0e7490;
    --accent-ink: #ffffff;

    --r-ctl: 3px;
    --r-card: 4px;
    --sheen: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(0 0 0 / .08));

    /* status (reserved, never decorative) */
    --ok: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --danger: #b91c1c;

    /* light */
    --bg: #fafafa;
    --surface: #f1f1f3;
    --surface-2: #e9e9ed;
    --text: #131316;
    --text-2: #55555e;
    --muted: #9b9ba6;
    --line: #e4e4e9;
    --accent-text: #0e7490;
    --accent-soft: #e2f0f4;

    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d;
      --surface: #17171a;
      --surface-2: #212126;
      --text: #f2f2f4;
      --text-2: #a3a3ad;
      --muted: #5b5b66;
      --line: #26262c;
      --accent-text: #3aa8c4;
      --accent-soft: #0c2229;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #17171a;
    --surface-2: #212126;
    --text: #f2f2f4;
    --text-2: #a3a3ad;
    --muted: #5b5b66;
    --line: #26262c;
    --accent-text: #3aa8c4;
    --accent-soft: #0c2229;
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body); font-size: 14.5px; line-height: 1.55;
    color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 18px 72px; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  h1 { font-size: clamp(28px, 6vw, 44px); margin: 6px 0 4px; }
  h2 { font-size: clamp(18px, 3vw, 22px); margin: 0 0 12px; }
  h3 { font-size: 16px; margin: 0; }
  p { margin: 6px 0; }

  a { color: var(--accent-text); text-underline-offset: 3px; text-decoration-thickness: 1px; }

  .mono, .num, code, pre, time { font-family: var(--font-mono); font-size: 0.92em; }
  .muted { color: var(--text-2); font-size: 13px; }
  .meta { color: var(--text-2); font-size: 13px; }
  .lead { color: var(--text-2); font-size: 14px; margin: 6px 0 2px; }
  .star { color: var(--muted); }

  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- top nav (full-width accent band) ---------- */
  .nav {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--accent-soft);
    padding: 12px max(18px, calc((100% - 860px) / 2 + 18px));
  }
  .wordmark {
    font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em;
    font-size: 20px; color: var(--text); text-decoration: none;
  }
  .back { display: inline-block; color: var(--text-2); text-decoration: none; font-size: 13px; margin-bottom: 4px; }
  .back:hover { color: var(--accent-text); }

  /* ---------- forms ---------- */
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
  input, select, textarea {
    font-family: var(--font-body); font-size: 14px; color: var(--text);
    background: var(--surface-2); border: none; border-radius: var(--r-ctl);
    padding: 9px 11px; min-height: 38px;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { width: 100%; resize: vertical; min-height: auto; }
  .group input, .group select, .group textarea { background: var(--surface); }

  /* ---------- buttons (labels Title Case in markup) ---------- */
  button { font-family: var(--font-body); cursor: pointer; }
  .btn-primary, button.btn-sm, a.btn-sm, .vote {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    color: var(--text); background-color: var(--surface-2); border: none;
    border-radius: var(--r-ctl); padding: 9px 15px; min-height: 38px;
    cursor: pointer; text-decoration: none;
  }
  button.btn-sm, a.btn-sm, .vote { font-size: 13px; padding: 7px 12px; min-height: 34px; }
  button.btn-sm:hover, a.btn-sm:hover, .vote:hover { background-color: var(--surface); }
  .btn-primary {
    color: var(--accent-ink); background-color: var(--accent); background-image: var(--sheen);
    font-weight: 600; border-radius: var(--r-ctl); padding: 9px 16px;
  }
  .btn-primary:hover { background-color: var(--accent-deep); }
  .btn-primary.btn-sm { color: var(--accent-ink); background-color: var(--accent); background-image: var(--sheen); }
  .btn-primary.btn-sm:hover { background-color: var(--accent-deep); }

  .btn-ghost {
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    background: none; border: none; color: var(--text-2);
    padding: 6px 8px; border-radius: var(--r-ctl); cursor: pointer;
  }
  .btn-ghost:hover { color: var(--accent-text); background: var(--surface-2); }
  .btn-danger { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--bad); border: none; background: none; padding: 6px 8px; cursor: pointer; }
  .btn-danger:hover { text-decoration: underline; }
  @media (pointer: coarse) { .btn-primary, button.btn-sm, a.btn-sm, .vote { min-height: 44px; } }

  /* ---------- layout helpers ---------- */
  .inline { display: inline; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .stack > * + * { margin-top: 13px; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border-radius: var(--r-card); padding: 16px 18px; margin: 14px 0; }

  /* ---------- boarding-pass stamp (flat) ---------- */
  .ticket { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
  .ticket::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .stamp {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent-text); background: var(--accent-soft);
    border-radius: var(--r-ctl); padding: 3px 8px;
  }

  /* ---------- mode tabs ---------- */
  .modes { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 20px 0 8px; }
  .modes a { text-decoration: none; padding: 8px 14px; color: var(--text-2); font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .modes a:hover { color: var(--text); }
  .modes a.active { color: var(--accent-text); border-bottom-color: var(--accent); font-weight: 600; }

  /* ---------- location chips ---------- */
  .locations { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  .tag {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--surface-2); border-radius: var(--r-ctl);
    padding: 4px 6px 4px 10px; font-size: 13px; color: var(--text);
  }

  /* ---------- chips / status ---------- */
  .pill {
    display: inline-block; font-size: 12px; font-weight: 600;
    color: var(--accent-text); background: var(--accent-soft);
    border-radius: var(--r-ctl); padding: 3px 8px;
  }
  .pill { color: var(--text-2); background: var(--surface-2); }
  .pill-preferred { color: var(--accent-text); background: var(--accent-soft); }
  .pill-selected { color: var(--accent-ink); background-color: var(--accent-deep); background-image: var(--sheen); }

  /* ---------- nested budget group ---------- */
  .group { background: var(--surface-2); border-radius: var(--r-card); padding: 13px 14px; margin: 11px 0; }
  .group-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .group-title { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; font-size: 15px; }

  /* ---------- option lists ---------- */
  .opts { list-style: none; padding: 0; margin: 0; }
  .opts > li { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .opts > li:last-child { border-bottom: none; }
  .addform { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .addform input[name=label], .addform input[name=notes] { flex: 1 1 130px; }

  .hotels { list-style: none; padding: 0; margin: 8px 0 4px; }
  .hotels li { padding: 9px 2px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hotels li:last-child { border-bottom: none; }
  .hotels li.chosen { background: var(--accent-soft); border-radius: var(--r-ctl); padding: 9px 11px; border-bottom: none; }

  .activities { list-style: none; padding: 0; margin: 4px 0; counter-reset: rank; }
  .activities li { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .activities li:last-child { border-bottom: none; }
  .activities li::before { counter-increment: rank; content: counter(rank); font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--accent-text); min-width: 16px; }

  /* ---------- votes ---------- */
  .votes { color: var(--text-2); font-size: 13px; white-space: nowrap; }
  .vote.on, .vote.on:hover { color: var(--accent-ink); background-color: var(--accent); background-image: var(--sheen); }
  .vote.on:hover { background-color: var(--accent-deep); }

  .statusbtns { display: flex; gap: 6px; flex-wrap: wrap; }

  .shareurl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .shareurl input { flex: 1 1 240px; font-family: var(--font-mono); font-size: 13px; }
  .empty { color: var(--text-2); font-size: 14px; padding: 22px 0; text-align: center; }
  .section-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 24px 0 2px; }
  .section-title h2 { margin: 0; }

  /* ---------- signature ---------- */
  .b-glyph {
    position: fixed; bottom: 10px; right: 10px; z-index: 90;
    font-family: var(--font-display); font-weight: 800; font-size: 13px; line-height: 1;
    color: var(--text-2); background: var(--surface); border-radius: var(--r-ctl);
    padding: 6px 8px; text-decoration: none;
  }
  .b-glyph:hover { color: var(--accent-text); }
</style>
</head>
<body>
{{end}}

{{define "foot"}}
<a class="b-glyph" href="https://index.baileys.app" title="A Bailey App">b.</a>
<script>
// Every action is a form POST that redirects back to the same page, which would
// otherwise reload scrolled to the top. Remember the scroll position on submit
// and restore it after the redirect (same path only).
(function () {
  try {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    var KEY = "voyage:scroll";
    var saved = sessionStorage.getItem(KEY);
    if (saved) {
      sessionStorage.removeItem(KEY);
      var d = JSON.parse(saved);
      if (d && d.p === location.pathname) {
        var y = d.y;
        window.scrollTo(0, y);
        requestAnimationFrame(function () { window.scrollTo(0, y); });
      }
    }
    document.addEventListener("submit", function () {
      try { sessionStorage.setItem(KEY, JSON.stringify({ p: location.pathname, y: window.scrollY })); } catch (e) {}
    }, true);
  } catch (e) {}
})();

// Date range convenience: keep start/end sensible. Picking a start fills/repairs
// the end to start+1 night; picking an end fills/repairs the start to end-1.
(function () {
  function shift(s, days) {
    var p = s.split("-");
    var dt = new Date(+p[0], (+p[1]) - 1, +p[2]);
    dt.setDate(dt.getDate() + days);
    var m = String(dt.getMonth() + 1).padStart(2, "0");
    var d = String(dt.getDate()).padStart(2, "0");
    return dt.getFullYear() + "-" + m + "-" + d;
  }
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || t.tagName !== "INPUT" || t.type !== "date" || !t.form) return;
    if (t.name === "start" && t.value) {
      var end = t.form.querySelector('input[type=date][name="end"]');
      if (end && (!end.value || end.value < t.value)) end.value = shift(t.value, 1);
    } else if (t.name === "end" && t.value) {
      var start = t.form.querySelector('input[type=date][name="start"]');
      if (start && (!start.value || start.value > t.value)) start.value = shift(t.value, -1);
    }
  });
})();
</script>
</body></html>{{end}}

{{define "vote"}}{{if .Page.Voter}}<form method="post" action="/t/{{.Page.Token}}/vote" class="inline">
<input type="hidden" name="target_type" value="{{.Type}}">
<input type="hidden" name="target_id" value="{{.ID}}">
<input type="hidden" name="redirect" value="/t/{{.Page.Token}}#{{.Type}}-{{.ID}}">
<button class="vote btn-sm {{if .Voted}}on{{end}}">{{if .Voted}}Voted{{else}}Vote{{end}} &middot; <span class="num">{{.Votes}}</span></button>
</form>{{else}}<span class="votes"><span class="num">{{.Votes}}</span> votes</span>{{end}}{{end}}
