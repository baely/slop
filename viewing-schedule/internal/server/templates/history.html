<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}} — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --accent: #0891b2;
  --accent-deep: #0e7490;
  --accent-ink: #ffffff;

  --r-ctl: 3px;
  --r-card: 4px;
  --sheen: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(0 0 0 / .08));

  /* light */
  --bg: #fafafa;
  --surface: #f1f1f3;
  --surface-2: #e9e9ed;
  --text: #131316;
  --text-2: #55555e;
  --muted: #9b9ba6;
  --line: #e4e4e9;
  --accent-text: #0e7490;
  --accent-soft: #e2f0f4;

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0d;
    --surface: #17171a;
    --surface-2: #212126;
    --text: #f2f2f4;
    --text-2: #a3a3ad;
    --muted: #5b5b66;
    --line: #26262c;
    --accent-text: #3aa8c4;
    --accent-soft: #0c2229;
  }
}

:root[data-theme="dark"] {
  --bg: #0b0b0d;
  --surface: #17171a;
  --surface-2: #212126;
  --text: #f2f2f4;
  --text-2: #a3a3ad;
  --muted: #5b5b66;
  --line: #26262c;
  --accent-text: #3aa8c4;
  --accent-soft: #0c2229;
}

body { font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top nav band */
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: var(--accent-soft); flex-wrap: wrap; }
.topnav .wordmark { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; font-size: 18px; color: var(--text); text-decoration: none; text-transform: lowercase; }
.topnav-right { display: flex; align-items: center; gap: 16px; }
.topnav a.navlink { color: var(--text-2); text-decoration: none; font-weight: 500; font-size: 13px; }
.topnav a.navlink:hover { color: var(--accent-text); }

.app { max-width: 1100px; margin: 0 auto; padding: 24px 24px 96px; }

.page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-title { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; font-size: clamp(28px, 6vw, 44px); line-height: 1.1; color: var(--text); }
.sub { font-size: 13px; color: var(--text-2); }
.mono { font-family: var(--font-mono); }

.year-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.year-filter a { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); text-decoration: none; background: var(--surface); padding: 5px 10px; border-radius: var(--r-ctl); }
.year-filter a:hover { color: var(--accent-text); }
.year-filter a.active { color: var(--accent-ink); background-color: var(--accent); background-image: var(--sheen); font-weight: 600; }

.summary { display: flex; gap: 32px; margin-bottom: 28px; flex-wrap: wrap; }
.summary div { display: flex; flex-direction: column; gap: 2px; }
.summary strong { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; color: var(--text); font-size: 30px; line-height: 1; }
.summary span { font-size: 12px; font-weight: 600; color: var(--text-2); }

/* Side month index, sticky */
.layout { display: grid; grid-template-columns: 56px 1fr; gap: 24px; align-items: start; }
.month-rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px; padding-top: 36px; }
.month-rail a { display: block; padding: 6px 4px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; text-align: center; color: var(--muted); text-decoration: none; border-radius: var(--r-ctl); }
.month-rail a:hover { color: var(--accent-text); }
.month-rail a.has-data { color: var(--text-2); font-weight: 500; }
.month-rail a.active { color: var(--accent-ink); background-color: var(--accent); background-image: var(--sheen); }
.month-rail .count { font-family: var(--font-mono); font-size: 9px; color: var(--muted); font-weight: 400; display: block; margin-top: 1px; }
.month-rail a.has-data .count { color: var(--text-2); }
.month-rail a.active .count { color: rgb(255 255 255 / .85); }

.months { display: flex; flex-direction: column; gap: 32px; }
.month { scroll-margin-top: 16px; }
.month-header { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 8px; margin-bottom: 12px; }
.month-title { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; font-size: 18px; color: var(--text); }
.month-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); }

.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dow { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: center; padding: 4px 0 2px; }

/* Base day cell - same shape regardless of how many films are in it. */
.day {
  aspect-ratio: 1/1;
  background: var(--surface);
  border-radius: var(--r-card);
  position: relative;
  overflow: hidden;
}
.day.empty { background: transparent; }

/* The date badge sits on top of everything, top-left. */
.day .date-badge {
  position: absolute;
  top: 4px;
  left: 4px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  line-height: 1;
  padding: 3px 5px;
  border-radius: var(--r-ctl);
  pointer-events: none;
}

/* Empty days: just the date, no card chrome. */
.day:not(.has-viewing) .date-badge { color: var(--muted); }

/* Days with viewings: poster strip fills the cell, date overlays it. */
.day.has-viewing { background: #111; cursor: pointer; }
.day.has-viewing .date-badge {
  color: #fff;
  background: linear-gradient(135deg, rgba(0,0,0,0.65), rgba(0,0,0,0.35));
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* Today indicator: teal ring around the cell (selected-state teal). */
.day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.day.has-viewing.today { box-shadow: inset 0 0 0 2px var(--accent); }
.day.today .date-badge { color: var(--accent-text); background: var(--bg); }
.day.has-viewing.today .date-badge { color: #fff; background: var(--accent); }

/* Poster strip: fills cell, splits adaptively based on count. (content) */
.day .strip { position: absolute; inset: 0; display: flex; gap: 1px; background: #111; }
.day .strip .slot {
  flex: 1 1 0;
  position: relative;
  overflow: hidden;
  background: #1a1a1a;
}
.day .strip .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Fallback when there's no poster image: show short title. */
.day .strip .slot .nofilm {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 9px;
  color: #888;
  padding: 4px;
  line-height: 1.2;
}

/* Bigger day cells on small viewports for readability */
@media (min-width: 700px) {
  .month-grid { gap: 8px; }
}
@media (max-width: 600px) {
  .layout { grid-template-columns: 40px 1fr; gap: 12px; }
  .app { padding: 16px 12px 64px; }
  .topnav { padding: 12px 16px; }
  .month-rail a { font-size: 9px; }
}

.empty-state { text-align: center; padding: 64px 16px; color: var(--text-2); }
.empty-state h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; font-size: 20px; color: var(--text); margin-bottom: 8px; }
.empty-state code { font-family: var(--font-mono); background: var(--surface); padding: 2px 6px; border-radius: var(--r-ctl); font-size: 12px; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-start; justify-content: center; padding: 32px 16px; z-index: 100; overflow-y: auto; }
.overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--r-card); width: 100%; max-width: 720px; padding: 24px; position: relative; }
.modal h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; font-size: 18px; color: var(--text); margin-bottom: 16px; padding-right: 72px; }
.viewing { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.viewing:first-of-type { border-top: none; padding-top: 0; }
.viewing img { width: 110px; border-radius: var(--r-ctl); }
.viewing .no-poster { width: 110px; aspect-ratio: 2/3; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 9px; border-radius: var(--r-ctl); }
.v-info h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; font-size: 18px; color: var(--text); margin-bottom: 6px; }
.v-info h3 .yr { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 0.7em; }
.v-meta { font-size: 12px; color: var(--text-2); margin-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.v-meta .stars { color: var(--text); font-weight: 600; letter-spacing: 0.05em; }
.v-meta .num { font-family: var(--font-mono); color: var(--text-2); }
.v-meta .tag { font-size: 11px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border-radius: var(--r-ctl); padding: 2px 8px; }
.v-overview { font-size: 13px; color: var(--text-2); line-height: 1.55; margin-top: 8px; }
.v-link { font-size: 12px; margin-top: 10px; }
.v-link a { color: var(--accent-text); text-decoration: none; }
.modal-close { position: absolute; top: 16px; right: 16px; background: var(--surface-2); border: none; font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-2); padding: 6px 12px; border-radius: var(--r-ctl); line-height: 1; }
.modal-close:hover { color: var(--accent-text); }

.b-glyph { position: fixed; bottom: 10px; right: 10px; z-index: 90; font-family: var(--font-display); font-weight: 800; font-size: 13px; line-height: 1; color: var(--text-2); background: var(--surface); border-radius: var(--r-ctl); padding: 6px 8px; text-decoration: none; }
.b-glyph:hover { color: var(--accent-text); }
</style>
</head>
<body>
<nav class="topnav">
  <a class="wordmark" href="/">{{.Title}}</a>
  <div class="topnav-right">
    <a class="navlink" href="/">Schedule</a>
  </div>
</nav>
<div class="app">
  <div class="page-head">
    <h1 class="page-title">History</h1>
    {{if .User}}<span class="sub">Diary of <span class="mono">{{.User}}</span></span>{{end}}
  </div>

  {{if .Years}}
  <div class="year-filter">
    {{range .Years}}
      <a href="/history?year={{.}}"{{if eq . $.Year}} class="active"{{end}}>{{.}}</a>
    {{end}}
  </div>
  {{end}}

  {{if not .HasAny}}
  <div class="empty-state">
    <h2>No viewings yet</h2>
    <p>Set <code>LETTERBOXD_USER</code> and click <strong>Sync Now</strong> on the admin panel to import your diary.</p>
  </div>
  {{else}}
  <div class="summary" id="summary"></div>
  <div class="layout">
    <nav class="month-rail" id="rail" aria-label="Jump to month"></nav>
    <div class="months" id="months"></div>
  </div>
  {{end}}
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">Close</button>
    <h2 id="modal-date"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<a class="b-glyph" href="https://index.baileys.app" title="A Bailey App">b.</a>

<script>
const YEAR = {{.Year}};
const TODAY = (() => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
})();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function escapeHTML(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n) { return String(n).padStart(2,'0'); }
function dateStr(y,m,d) { return y + '-' + pad(m+1) + '-' + pad(d); }
function stars(rating) {
  if (!rating) return '';
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  return '★'.repeat(full) + (half ? '½' : '');
}
function displayTitle(v) {
  if (v.tmdb_title) return v.tmdb_title;
  return String(v.title || '').replace(/\s*\(\d{4}\)\s*$/, '').trim();
}

function renderSummary(viewings) {
  const totals = { count: 0, rated: 0, liked: 0, rewatch: 0, films: new Set() };
  Object.values(viewings).forEach(arr => arr.forEach(v => {
    totals.count++;
    if (v.rating) totals.rated++;
    if (v.liked) totals.liked++;
    if (v.rewatch) totals.rewatch++;
    if (v.slug) totals.films.add(v.slug);
  }));
  document.getElementById('summary').innerHTML =
    '<div><strong>' + totals.count + '</strong><span>Viewings</span></div>' +
    '<div><strong>' + totals.films.size + '</strong><span>Unique Films</span></div>' +
    '<div><strong>' + totals.rated + '</strong><span>Rated</span></div>' +
    '<div><strong>' + totals.liked + '</strong><span>Liked</span></div>' +
    '<div><strong>' + totals.rewatch + '</strong><span>Rewatches</span></div>';
}

// Build a day cell. The cell shape is identical regardless of how many films
// were watched that day:
//   - 0 films: muted background + date number only
//   - N films: poster strip fills the cell (N vertical slices), date overlays
//     the top-left corner with a translucent badge for legibility
function dayCellHTML(date, items, isToday) {
  const dnum = parseInt(date.slice(8,10), 10);
  const cls = ['day'];
  if (items && items.length) cls.push('has-viewing');
  if (isToday) cls.push('today');

  const tooltip = items ? items.map(displayTitle).join(' · ') : '';
  let inner = '<div class="date-badge">' + dnum + '</div>';
  if (items && items.length) {
    let slots = '';
    items.slice(0, 3).forEach(v => {
      if (v.poster) {
        slots += '<div class="slot"><img src="' + escapeHTML(v.poster) + '" alt="' + escapeHTML(displayTitle(v)) + '"></div>';
      } else {
        slots += '<div class="slot"><div class="nofilm">' + escapeHTML(displayTitle(v)).slice(0, 24) + '</div></div>';
      }
    });
    inner += '<div class="strip">' + slots + '</div>';
  }
  return '<div class="' + cls.join(' ') + '" data-date="' + date + '"' + (tooltip ? ' title="' + escapeHTML(tooltip) + '"' : '') + '>' + inner + '</div>';
}

function renderCalendar(viewings) {
  renderSummary(viewings);

  // Per-month counts.
  const monthCounts = Array(12).fill(0);
  Object.entries(viewings).forEach(([date, arr]) => {
    const m = parseInt(date.slice(5,7), 10) - 1;
    if (m >= 0 && m < 12) monthCounts[m] += arr.length;
  });

  // Side rail.
  let rail = '';
  for (let m = 0; m < 12; m++) {
    const cls = ['rail-month'];
    if (monthCounts[m] > 0) cls.push('has-data');
    rail += '<a href="#m' + m + '" data-month="' + m + '" class="' + (monthCounts[m] > 0 ? 'has-data' : '') + '">' +
      MONTHS_SHORT[m] + '<span class="count">' + (monthCounts[m] || '') + '</span></a>';
  }
  document.getElementById('rail').innerHTML = rail;

  // Months.
  let html = '';
  for (let m = 0; m < 12; m++) {
    html += '<section class="month" id="m' + m + '">';
    html += '<div class="month-header">';
    html += '<div class="month-title">' + MONTHS[m] + ' <span style="color:var(--muted);font-weight:400;font-size:14px;font-family:var(--font-mono);">' + YEAR + '</span></div>';
    html += '<div class="month-count">' + (monthCounts[m] ? monthCounts[m] + ' viewings' : '—') + '</div>';
    html += '</div>';
    html += '<div class="month-grid">';
    DOW.forEach(d => { html += '<div class="dow">' + d + '</div>'; });

    const first = new Date(YEAR, m, 1);
    let weekday = (first.getDay() + 6) % 7; // Mon=0
    for (let i = 0; i < weekday; i++) html += '<div class="day empty"></div>';
    const daysInMonth = new Date(YEAR, m+1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = dateStr(YEAR, m, d);
      const items = viewings[ds];
      html += dayCellHTML(ds, items, ds === TODAY);
    }
    html += '</div></section>';
  }
  document.getElementById('months').innerHTML = html;

  // Click handler.
  document.getElementById('months').addEventListener('click', e => {
    const t = e.target.closest('.day.has-viewing');
    if (!t) return;
    const ds = t.getAttribute('data-date');
    openModal(ds, viewings[ds] || []);
  });

  // Scroll-spy for the side rail.
  const railLinks = Array.from(document.querySelectorAll('.month-rail a'));
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const m = entry.target.id.slice(1);
        railLinks.forEach(a => a.classList.toggle('active', a.dataset.month === m));
      }
    });
  }, { rootMargin: '-30% 0px -65% 0px', threshold: 0 });
  document.querySelectorAll('.month').forEach(s => obs.observe(s));

  // If today is in this year, scroll to its month on first paint.
  if (TODAY.startsWith(String(YEAR) + '-')) {
    const tm = parseInt(TODAY.slice(5,7), 10) - 1;
    const target = document.getElementById('m' + tm);
    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
  }
}

function openModal(date, items) {
  const d = new Date(date + 'T12:00:00');
  document.getElementById('modal-date').textContent = d.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const body = document.getElementById('modal-body');
  let html = '';
  items.forEach(v => {
    html += '<div class="viewing">';
    html += '<div>' + (v.poster_lg || v.poster ? '<img src="' + escapeHTML(v.poster_lg || v.poster) + '" alt="">' : '<div class="no-poster">No poster</div>') + '</div>';
    html += '<div class="v-info">';
    html += '<h3>' + escapeHTML(displayTitle(v)) + (v.year ? ' <span class="yr">(' + escapeHTML(v.year) + ')</span>' : '') + '</h3>';
    const meta = [];
    if (v.rating) meta.push('<span class="stars" title="' + v.rating + '/5">' + stars(v.rating) + '</span> <span class="num">' + v.rating.toFixed(1) + '</span>');
    if (v.liked) meta.push('<span class="tag">Liked</span>');
    if (v.rewatch) meta.push('<span class="tag">Rewatch</span>');
    if (meta.length) html += '<div class="v-meta">' + meta.join('') + '</div>';
    const meta2 = [];
    if (v.director) meta2.push(escapeHTML(v.director));
    if (v.runtime) meta2.push(v.runtime + ' min');
    if (v.genres && v.genres.length) meta2.push(escapeHTML(v.genres.slice(0,3).join(', ')));
    if (meta2.length) html += '<div class="v-meta">' + meta2.join(' · ') + '</div>';
    if (v.overview) html += '<div class="v-overview">' + escapeHTML(v.overview) + '</div>';
    if (v.letterboxd_url) html += '<div class="v-link"><a href="' + escapeHTML(v.letterboxd_url) + '" target="_blank" rel="noreferrer">View on Letterboxd →</a></div>';
    html += '</div></div>';
  });
  body.innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.getElementById('modal-close').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

{{if .HasAny}}
fetch('/api/history?year=' + YEAR).then(r => r.json()).then(d => renderCalendar(d.viewings || {}));
{{end}}
</script>
</body>
</html>
