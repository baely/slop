<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --accent: #0891b2;
  --accent-deep: #0e7490;
  --accent-ink: #ffffff;

  --r-ctl: 3px;
  --r-card: 4px;
  --sheen: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(0 0 0 / .08));

  /* light */
  --bg: #fafafa;
  --surface: #f1f1f3;
  --surface-2: #e9e9ed;
  --text: #131316;
  --text-2: #55555e;
  --muted: #9b9ba6;
  --line: #e4e4e9;
  --accent-text: #0e7490;
  --accent-soft: #e2f0f4;

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0d;
    --surface: #17171a;
    --surface-2: #212126;
    --text: #f2f2f4;
    --text-2: #a3a3ad;
    --muted: #5b5b66;
    --line: #26262c;
    --accent-text: #3aa8c4;
    --accent-soft: #0c2229;
  }
}

:root[data-theme="dark"] {
  --bg: #0b0b0d;
  --surface: #17171a;
  --surface-2: #212126;
  --text: #f2f2f4;
  --text-2: #a3a3ad;
  --muted: #5b5b66;
  --line: #26262c;
  --accent-text: #3aa8c4;
  --accent-soft: #0c2229;
}

body { font-family: var(--font-body); font-size: 14.5px; line-height: 1.55; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top nav band */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; background: var(--accent-soft); }
.nav .wordmark { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; font-size: 18px; color: var(--text); text-decoration: none; text-transform: lowercase; }
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-right .date-range { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
.nav a.navlink { color: var(--text-2); text-decoration: none; font-weight: 500; font-size: 13px; }
.nav a.navlink:hover { color: var(--accent-text); }

.app { max-width: 1100px; margin: 0 auto; padding: 24px 16px 96px; }

.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
.section-label { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; font-size: 15px; color: var(--text); margin-bottom: 16px; }

.today-card { margin-bottom: 24px; }
.today-movie { display: grid; grid-template-columns: 140px 1fr; gap: 20px; margin-bottom: 24px; }
.today-movie img { width: 140px; border-radius: var(--r-ctl); display: block; }
.today-meta h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; font-size: 26px; line-height: 1.1; margin-bottom: 4px; }
.today-meta .year { color: var(--muted); font-weight: 800; }
.today-meta .director { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.today-meta .genres { font-size: 11px; margin-bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.today-meta .genre-tag { background: var(--surface-2); color: var(--text-2); padding: 2px 8px; border-radius: var(--r-ctl); font-size: 11px; font-weight: 500; }
.today-meta .runtime { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.today-meta .overview { font-size: 13.5px; color: var(--text-2); line-height: 1.6; }
.today-meta .rating { font-family: var(--font-mono); font-size: 12px; color: var(--accent-text); margin-top: 8px; }
.today-reason { font-size: 13px; color: var(--text-2); margin-top: 16px; padding: 12px 14px; background: var(--surface); border-radius: var(--r-card); line-height: 1.6; }
.no-today { color: var(--text-2); font-size: 14px; padding: 32px 0; }

.upcoming-list { list-style: none; }
.upcoming-item { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.upcoming-item:first-child { padding-top: 0; }
.upcoming-item.is-past { opacity: 0.4; }
.upcoming-date { text-align: center; }
.upcoming-date .d-month { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-2); }
.upcoming-date .d-day { font-family: var(--font-mono); font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.15; }
.upcoming-date .d-weekday { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
.upcoming-movies { display: flex; flex-direction: column; gap: 10px; }
.upcoming-movie { display: flex; gap: 12px; align-items: start; }
.upcoming-movie img { width: 38px; border-radius: var(--r-ctl); flex-shrink: 0; }
.upcoming-movie-info h3 { font-family: var(--font-body); font-size: 14px; font-weight: 600; line-height: 1.3; }
.upcoming-movie-info h3 .yr { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11px; }
.upcoming-movie-info .um-detail { font-size: 12px; color: var(--text-2); margin-top: 1px; }
.upcoming-item.is-today { background: var(--accent-soft); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: var(--r-card); border-bottom-color: transparent; }
.no-poster { width: 100%; aspect-ratio: 2/3; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 10px; letter-spacing: 0.03em; border-radius: var(--r-ctl); }
.upcoming-movie .no-poster { width: 38px; font-size: 7px; }
.empty { color: var(--text-2); font-size: 14px; padding: 24px 0; }

.b-glyph { position: fixed; bottom: 10px; right: 10px; z-index: 90; font-family: var(--font-display); font-weight: 800; font-size: 13px; line-height: 1; color: var(--text-2); background: var(--surface); border-radius: var(--r-ctl); padding: 6px 8px; text-decoration: none; }
.b-glyph:hover { color: var(--accent-text); }

@media (max-width: 700px) {
  .layout { grid-template-columns: 1fr; gap: 32px; }
  .today-movie { grid-template-columns: 100px 1fr; gap: 14px; }
  .today-movie img { width: 100px; }
}
</style>
</head>
<body>
<nav class="nav">
  <a class="wordmark" href="/">{{.Title}}</a>
  <div class="nav-right">
    {{if .DateRange}}<span class="date-range">{{.DateRange}}</span>{{end}}
    <a class="navlink" href="/history">History</a>
  </div>
</nav>
<div class="app">
  <div class="layout">
    <div class="today-panel">
      <div class="section-label">Today</div>
      <div id="today"></div>
    </div>
    <div class="upcoming-panel">
      <div class="section-label">Schedule</div>
      <ul class="upcoming-list" id="upcoming"></ul>
    </div>
  </div>
</div>
<a class="b-glyph" href="https://index.baileys.app" title="A Bailey App">b.</a>
<script>
const SCHEDULE = {{.ScheduleJSON}};

function formatDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return { month: months[d.getMonth()], day: d.getDate(), weekday: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] };
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Display title prefers TMDB's clean title; otherwise strip a trailing "(YYYY)"
// from the user-entered title so we don't render the year twice next to it.
function displayTitle(m) {
  if (m.tmdb_title) return m.tmdb_title;
  return String(m.title || '').replace(/\s*\(\d{4}\)\s*$/, '').trim();
}
function posterImg(url, cls) {
  if (url) return '<img src="' + escapeHTML(url) + '" alt="" loading="lazy">';
  return '<div class="no-poster ' + (cls||'') + '">No poster</div>';
}
function renderToday() {
  const today = todayStr();
  const entry = SCHEDULE.find(s => s.date === today);
  const el = document.getElementById('today');
  if (!entry) {
    const next = SCHEDULE.find(s => s.date > today);
    if (next) {
      const fd = formatDate(next.date);
      el.innerHTML = '<div class="no-today">Nothing scheduled today.<br>Next up on <strong>' + fd.month + ' ' + fd.day + '</strong>.</div>';
    } else {
      el.innerHTML = '<div class="no-today">Schedule complete.</div>';
    }
    return;
  }
  let html = '<div class="today-card">';
  (entry.movies || []).forEach(m => {
    html += '<div class="today-movie">';
    html += '<div>' + posterImg(m.poster_lg || m.poster) + '</div>';
    html += '<div class="today-meta">';
    html += '<h2>' + escapeHTML(displayTitle(m)) + (m.year ? ' <span class="year">(' + escapeHTML(m.year) + ')</span>' : '') + '</h2>';
    if (m.director) html += '<div class="director">Directed by ' + escapeHTML(m.director) + '</div>';
    if (m.genres && m.genres.length) html += '<div class="genres">' + m.genres.map(g => '<span class="genre-tag">' + escapeHTML(g) + '</span>').join('') + '</div>';
    if (m.runtime) html += '<div class="runtime">' + m.runtime + ' min</div>';
    if (m.overview) html += '<div class="overview">' + escapeHTML(m.overview) + '</div>';
    if (m.rating) html += '<div class="rating">TMDB ' + m.rating.toFixed(1) + '</div>';
    html += '</div></div>';
  });
  if (entry.reason) html += '<div class="today-reason">' + escapeHTML(entry.reason) + '</div>';
  html += '</div>';
  el.innerHTML = html;
}
function renderUpcoming() {
  const today = todayStr();
  const el = document.getElementById('upcoming');
  if (!SCHEDULE.length) { el.innerHTML = '<li class="empty">No films scheduled yet.</li>'; return; }
  let html = '';
  SCHEDULE.forEach(entry => {
    const fd = formatDate(entry.date);
    const isPast = entry.date < today;
    const isToday = entry.date === today;
    html += '<li class="upcoming-item' + (isPast ? ' is-past' : '') + (isToday ? ' is-today' : '') + '">';
    html += '<div class="upcoming-date"><div class="d-month">' + fd.month + '</div><div class="d-day">' + fd.day + '</div><div class="d-weekday">' + fd.weekday + '</div></div>';
    html += '<div class="upcoming-movies">';
    (entry.movies || []).forEach(m => {
      html += '<div class="upcoming-movie">';
      html += posterImg(m.poster, '');
      html += '<div class="upcoming-movie-info"><h3>' + escapeHTML(displayTitle(m)) + (m.year ? ' <span class="yr">' + escapeHTML(m.year) + '</span>' : '') + '</h3>';
      const parts = [];
      if (m.director) parts.push(escapeHTML(m.director));
      if (m.runtime) parts.push(m.runtime + 'm');
      if (m.genres && m.genres.length) parts.push(escapeHTML(m.genres.slice(0,2).join(', ')));
      if (parts.length) html += '<div class="um-detail">' + parts.join(' &middot; ') + '</div>';
      html += '</div></div>';
    });
    html += '</div></li>';
  });
  el.innerHTML = html;
}
renderToday();
renderUpcoming();
</script>
</body>
</html>
