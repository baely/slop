# Local/dev compose. Production is deployed from baely/infra
# (docker/github.com_baely_slop_traccar-proxy/deploy.yaml).
services:
  traccar-proxy:
    build: .
    image: registry.baileys.dev/traccar-proxy:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATA_DIR: "/data"
      # Secret path the client must use; leave empty to accept on /.
      TOKEN: "${TOKEN:-}"
      # One TARGET_<name> per upstream. Fixed query params on a target URL
      # override the client's (e.g. ?id=phone).
      TARGET_TRACCAR: "${TARGET_TRACCAR:?set TARGET_TRACCAR}"
    volumes:
      - traccar-proxy-data:/data

volumes:
  traccar-proxy-data:
