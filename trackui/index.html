<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>track — live location</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* ---------- house tokens (bailey house style v1) ---------- */
    :root {
      --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --accent: #0891b2;
      --accent-deep: #0e7490;
      --accent-ink: #ffffff;

      --r-ctl: 3px;
      --r-card: 4px;
      --sheen: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(0 0 0 / .08));

      /* light */
      --bg: #fafafa;
      --surface: #f1f1f3;
      --surface-2: #e9e9ed;
      --text: #131316;
      --text-2: #55555e;
      --muted: #9b9ba6;
      --line: #e4e4e9;
      --accent-text: #0e7490;
      --accent-soft: #e2f0f4;

      /* status palette (reserved, never decorative; same in both modes) */
      --status-good: #15803d;
      --status-bad: #b91c1c;

      /* third-party brand: small semantic mark only, never chrome */
      --spotify: #1DB954;

      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0b0d;
        --surface: #17171a;
        --surface-2: #212126;
        --text: #f2f2f4;
        --text-2: #a3a3ad;
        --muted: #5b5b66;
        --line: #26262c;
        --accent-text: #3aa8c4;
        --accent-soft: #0c2229;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b0b0d;
      --surface: #17171a;
      --surface-2: #212126;
      --text: #f2f2f4;
      --text-2: #a3a3ad;
      --muted: #5b5b66;
      --line: #26262c;
      --accent-text: #3aa8c4;
      --accent-soft: #0c2229;
    }

    /* ---------- base ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; }
    body {
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
    }
    .mono { font-family: var(--font-mono); font-size: 0.93em; }
    ::selection { background: var(--accent); color: var(--accent-ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Live position marker (map overlay: dot on the fix, status label beside it) */
    .live-flag { display: flex; align-items: center; gap: 5px; width: max-content; }
    .live-flag .dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--accent-ink);
      box-sizing: content-box;
    }
    .live-flag .label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      color: var(--accent-ink);
      padding: 3px 7px;
      border-radius: var(--r-ctl);
    }
    .live-flag.live .dot, .live-flag.live .label { background: var(--status-good); }
    .live-flag.stale .dot, .live-flag.stale .label { background: var(--status-bad); }

    /* Side panel */
    #panel {
      position: absolute;
      top: 0; left: 0;
      width: 360px; height: 100%;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    #panel.collapsed {
      transform: translateX(-360px);
    }
    #panel-toggle {
      position: absolute;
      top: 12px;
      right: -56px;
      width: 56px; height: 34px;
      background: var(--bg);
      border: none;
      border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #panel-toggle:hover { background: var(--surface-2); color: var(--text); }

    #panel-header {
      padding: 12px 16px;
      background: var(--accent-soft);
    }
    #panel-header .wordmark {
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: 18px;
      color: var(--text);
    }

    .panel-section {
      padding: 12px 16px;
    }
    .panel-section h3 {
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 8px;
    }

    /* Duration tabs */
    .duration-tabs {
      display: flex;
      gap: 6px;
    }
    .duration-tab {
      flex: 1;
      padding: 8px 0;
      min-height: 36px;
      border: none;
      border-radius: var(--r-ctl);
      background-color: var(--surface);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
    }
    .duration-tab.active {
      background-color: var(--accent);
      background-image: var(--sheen);
      color: var(--accent-ink);
    }
    .duration-tab:not(.active):hover {
      background-color: var(--surface-2);
    }

    /* Trips section */
    #trips-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: 34%;
    }
    #trips-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .trip-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: var(--r-ctl);
      cursor: pointer;
      background: var(--surface);
    }
    .trip-item:hover {
      background: var(--surface-2);
    }
    .trip-item.active {
      background: var(--accent-soft);
    }
    .trip-item.active .trip-date {
      color: var(--accent-text);
    }
    .trip-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .trip-time {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-2);
      margin-top: 2px;
    }
    .trip-loading, .transaction-loading, .listening-loading {
      padding: 10px 0;
      color: var(--text-2);
      font-size: 13px;
    }

    /* Transactions section */
    #transactions-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: 33%;
    }
    #transactions-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .transaction-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: var(--r-ctl);
      cursor: pointer;
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .transaction-item:hover {
      background: var(--surface-2);
    }
    .transaction-item.active {
      background: var(--accent-soft);
    }
    .transaction-info {
      flex: 1;
      min-width: 0;
    }
    .transaction-vendor {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .transaction-time {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-2);
      margin-top: 2px;
    }
    .transaction-location {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .transaction-amount {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-left: 12px;
      white-space: nowrap;
    }

    /* Listening section */
    #listening-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: 33%;
    }
    #listening-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .listening-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: var(--r-ctl);
      cursor: pointer;
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .listening-item:hover {
      background: var(--surface-2);
    }
    .listening-item.active {
      background: var(--accent-soft);
    }
    .listening-info {
      flex: 1;
      min-width: 0;
    }
    .listening-track {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .listening-artist {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 2px;
    }
    .listening-time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .listening-location {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .listening-spotify {
      flex-shrink: 0;
      margin-left: 10px;
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      text-decoration: none;
    }
    .listening-spotify::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--spotify);
    }
    .listening-spotify:hover {
      color: var(--accent-text);
    }

    /* Listening map markers: white fill, teal ring — distinct from filled transaction markers */
    .listening-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-ink);
      color: var(--accent-deep);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--accent);
    }

    /* Transaction map markers: filled teal */
    .transaction-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--accent-ink);
    }

    /* Show All button */
    #show-all-btn {
      display: none;
      margin: 0 0 8px;
      padding: 8px 0;
      min-height: 36px;
      border: none;
      border-radius: var(--r-ctl);
      background-color: var(--surface);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #show-all-btn:hover {
      background-color: var(--surface-2);
    }

    /* Leaflet tooltips follow the chrome */
    .leaflet-tooltip {
      background: var(--bg);
      color: var(--text);
      border: none;
      box-shadow: none;
      border-radius: var(--r-ctl);
      font-family: var(--font-body);
    }
    .leaflet-tooltip-top:before { border-top-color: var(--bg); }
    .leaflet-tooltip-bottom:before { border-bottom-color: var(--bg); }
    .leaflet-tooltip-left:before { border-left-color: var(--bg); }
    .leaflet-tooltip-right:before { border-right-color: var(--bg); }

    /* Signature (nudged above Leaflet attribution) */
    .b-glyph {
      position: fixed;
      bottom: 30px;
      right: 10px;
      z-index: 1100;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 13px;
      line-height: 1;
      color: var(--text-2);
      background: var(--surface);
      border-radius: var(--r-ctl);
      padding: 6px 8px;
      text-decoration: none;
    }
    .b-glyph:hover { color: var(--accent-text); }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <button id="panel-toggle" title="Toggle Panel">Hide</button>

    <div id="panel-header">
      <span class="wordmark">track</span>
    </div>

    <div class="panel-section">
      <div class="duration-tabs">
        <button class="duration-tab active" data-duration="24h">24 Hours</button>
        <button class="duration-tab" data-duration="7d">7 Days</button>
        <button class="duration-tab" data-duration="30d">30 Days</button>
      </div>
    </div>

    <div id="trips-section" class="panel-section">
      <h3>Excursions</h3>
      <button id="show-all-btn">Show All</button>
      <div id="trips-list">
        <div class="trip-loading">Loading…</div>
      </div>
    </div>

    <div id="transactions-section" class="panel-section">
      <h3>Transactions</h3>
      <div id="transactions-list">
        <div class="transaction-loading">Loading…</div>
      </div>
    </div>

    <div id="listening-section" class="panel-section">
      <h3>Listening</h3>
      <div id="listening-list">
        <div class="listening-loading">Loading…</div>
      </div>
    </div>
  </div>

  <a class="b-glyph" href="https://index.baileys.app" title="A Bailey App">b.</a>

  <script>
    const BASE = '';
    const DEVICE_ID = 1;
    const STALE_THRESHOLD = 5 * 60 * 1000;

    // State
    let currentMode = 'duration'; // 'duration' | 'trip'
    let selectedTrip = null;
    let durationSetting = '24h';
    let detectedTrips = [];
    let currentTransactions = [];
    let transactionMarkers = L.layerGroup();
    let currentListening = [];
    let listeningMarkers = L.layerGroup();
    let highlightMarker = null;

    const PANEL_WIDTH = 360;

    function getPanelOffset() {
      const panel = document.getElementById('panel');
      return panel && !panel.classList.contains('collapsed') ? PANEL_WIDTH : 0;
    }

    function fitBoundsWithPanel(bounds) {
      map.fitBounds(bounds, {
        paddingTopLeft: [getPanelOffset() + 30, 30],
        paddingBottomRight: [30, 30]
      });
    }

    function setViewWithPanel(latlng, zoom) {
      map.setView(latlng, zoom);
      const offset = getPanelOffset();
      if (offset) map.panBy([-offset / 2, 0], { animate: false });
    }

    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 20
    }).addTo(map);

    transactionMarkers.addTo(map);
    listeningMarkers.addTo(map);

    let trail = null;
    let marker = null;
    let trailPoints = [];
    let firstLoad = true;
    const trailTooltip = L.tooltip({ sticky: true });

    function apiFetch(path) {
      return fetch(BASE + path).then(r => {
        if (!r.ok) throw new Error(`API ${r.status}`);
        return r.json();
      });
    }

    function fetchPositions(hours, bucketMs) {
      const now = new Date();
      const from = new Date(now.getTime() - hours * 60 * 60 * 1000);
      return apiFetch(`/api/positions?deviceId=${DEVICE_ID}&from=${from.toISOString()}&to=${now.toISOString()}`).then(raw => {
        return aggregatePositions(raw, bucketMs);
      });
    }

    function fetchLivePosition() {
      return apiFetch('/api/positions/live');
    }

    function aggregatePositions(positions, bucketMs = 30000) {
      const buckets = {};
      for (const p of positions) {
        const key = Math.floor(new Date(p.fixTime).getTime() / bucketMs);
        if (!buckets[key]) buckets[key] = p;
      }
      return Object.values(buckets).sort(
        (a, b) => new Date(a.fixTime) - new Date(b.fixTime)
      );
    }

    function formatTime(date) {
      return date.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    }

    function humanizeAge(date) {
      const s = Math.floor((Date.now() - date.getTime()) / 1000);
      if (s < 60) return 'just now';
      const m = Math.floor(s / 60);
      if (m < 60) return m === 1 ? '1 minute ago' : `${m} minutes ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return h === 1 ? '1 hour ago' : `${h} hours ago`;
      const d = Math.floor(h / 24);
      if (d === 1) return 'yesterday';
      return `${d} days ago`;
    }

    function findNearest(latlng, points) {
      let best = null, bestDist = Infinity;
      for (const p of points) {
        const dx = p.latitude - latlng.lat, dy = p.longitude - latlng.lng;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = p; }
      }
      return best;
    }

    function updateMarker(pos) {
      const age = Date.now() - new Date(pos.fixTime).getTime();
      const isLive = age < STALE_THRESHOLD;
      const cssClass = isLive ? 'live' : 'stale';

      const icon = L.divIcon({
        className: '',
        html: `<div class="live-flag ${cssClass}"><span class="dot"></span><span class="label">${isLive ? 'Live' : 'Stale'}</span></div>`,
        iconSize: [64, 18],
        iconAnchor: [8, 9]
      });

      if (marker) {
        marker.setLatLng([pos.latitude, pos.longitude]);
        marker.setIcon(icon);
      } else {
        marker = L.marker([pos.latitude, pos.longitude], { icon }).addTo(map);
      }

      const time = new Date(pos.fixTime);
      const label = isLive ? 'Live' : 'Last seen';
      marker.bindTooltip(`${label} — ${humanizeAge(time)}<br><span class="mono">${time.toLocaleString()}</span>`, { permanent: false });
    }

    function drawTrail(positions) {
      if (trail) map.removeLayer(trail);
      if (positions.length === 0) return;

      const latlngs = positions.map(p => [p.latitude, p.longitude]);
      trailPoints = positions;
      trail = L.polyline(latlngs, { color: '#0891b2', weight: 3, opacity: 0.7 }).addTo(map);
      trail.on('mouseover', () => trail.bindTooltip(trailTooltip));
      trail.on('mousemove', (e) => {
        const nearest = findNearest(e.latlng, trailPoints);
        if (nearest) trail.setTooltipContent(`<span class="mono">${new Date(nearest.fixTime).toLocaleString()}</span>`);
      });
    }

    function getDurationParams() {
      if (durationSetting === '24h') return { hours: 24, bucketMs: 30000 };
      if (durationSetting === '7d') return { hours: 168, bucketMs: 300000 };
      return { hours: 720, bucketMs: 600000 };
    }

    async function updateTrail() {
      if (currentMode === 'trip') return; // Don't refresh trail when viewing a trip
      try {
        const { hours, bucketMs } = getDurationParams();
        const positions = await fetchPositions(hours, bucketMs);
        if (positions.length === 0) return;

        drawTrail(positions);
        updateMarker(positions[positions.length - 1]);

        if (firstLoad) {
          fitBoundsWithPanel(trail.getBounds());
          firstLoad = false;
        }
        loadTransactions();
        loadListening();
      } catch (e) {
        console.error('Trail update failed:', e);
      }
    }

    async function updateLive() {
      try {
        const positions = await fetchLivePosition();
        const pos = positions.find(p => p.deviceId === DEVICE_ID);
        if (pos) updateMarker(pos);
      } catch (e) {
        console.error('Live update failed:', e);
      }
    }

    // --- Up Banking Transactions ---

    async function fetchTransactions(since, until) {
      return apiFetch(`/api/transactions?since=${encodeURIComponent(since)}&until=${encodeURIComponent(until)}`);
    }

    function findPositionAtTime(timestamp) {
      if (trailPoints.length === 0) return null;
      const time = new Date(timestamp).getTime();
      let lo = 0, hi = trailPoints.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (new Date(trailPoints[mid].fixTime).getTime() < time) lo = mid + 1;
        else hi = mid;
      }
      // Check lo and lo-1 for closest
      if (lo > 0) {
        const diffLo = Math.abs(new Date(trailPoints[lo].fixTime).getTime() - time);
        const diffPrev = Math.abs(new Date(trailPoints[lo - 1].fixTime).getTime() - time);
        if (diffPrev < diffLo) lo = lo - 1;
      }
      return trailPoints[lo];
    }

    function findExcursionForTimestamp(timestamp) {
      const time = new Date(timestamp).getTime();
      for (let i = 0; i < detectedTrips.length; i++) {
        const trip = detectedTrips[i];
        if (time >= trip.startTime.getTime() && time <= trip.endTime.getTime()) {
          return i;
        }
      }
      return null;
    }

    function getLocationLabel(timestamp) {
      const time = new Date(timestamp).getTime();
      for (const trip of detectedTrips) {
        if (time >= trip.startTime.getTime() && time <= trip.endTime.getTime()) {
          return `On ${trip.date} Excursion #${trip.tripNum}`;
        }
      }
      const pos = findPositionAtTime(timestamp);
      if (!pos) return '';
      const HOME = { lat: -37.817416, lng: 144.995483 };
      const WORK = { lat: -37.816086, lng: 144.961648 };
      const HOME_RADIUS = 50;
      const WORK_RADIUS = 175;
      const dist = (a, b) => {
        const R = 6371000;
        const dLat = (b.lat - a.lat) * Math.PI / 180;
        const dLng = (b.lng - a.lng) * Math.PI / 180;
        const sinLat = Math.sin(dLat / 2);
        const sinLng = Math.sin(dLng / 2);
        const h = sinLat * sinLat + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * sinLng * sinLng;
        return 2 * R * Math.asin(Math.sqrt(h));
      };
      const pt = { lat: pos.latitude, lng: pos.longitude };
      if (dist(pt, HOME) <= HOME_RADIUS) return 'At Home';
      if (dist(pt, WORK) <= WORK_RADIUS) return 'At Work';
      return '';
    }

    async function loadTransactions() {
      if (trailPoints.length === 0) return;
      const listEl = document.getElementById('transactions-list');
      try {
        const since = new Date(trailPoints[0].fixTime).toISOString();
        const until = new Date(trailPoints[trailPoints.length - 1].fixTime).toISOString();
        currentTransactions = await fetchTransactions(since, until);
        renderTransactions();
        renderTransactionMarkers();
      } catch (e) {
        console.error('Transaction loading failed:', e);
        listEl.innerHTML = '<div class="transaction-loading">Failed to load transactions.</div>';
      }
    }

    function renderTransactions() {
      const list = document.getElementById('transactions-list');
      const spending = currentTransactions.filter(tx => parseFloat(tx.amount.value) < 0);
      if (spending.length === 0) {
        list.innerHTML = '<div class="transaction-loading">0 transactions.</div>';
        return;
      }
      list.innerHTML = '';
      for (const tx of spending) {
        const item = document.createElement('div');
        item.className = 'transaction-item';
        item.dataset.id = tx.id;
        const date = new Date(tx.createdAt);
        const timeStr = date.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) + ' ' + formatTime(date);
        const val = Math.abs(parseFloat(tx.amount.value));
        const locationLabel = getLocationLabel(tx.createdAt);
        item.innerHTML = `
          <div class="transaction-info">
            <div class="transaction-vendor">${tx.description}</div>
            <div class="transaction-time">${timeStr}</div>
            ${locationLabel ? `<div class="transaction-location">${locationLabel}</div>` : ''}
          </div>
          <div class="transaction-amount">$${val.toFixed(2)}</div>
        `;
        item.addEventListener('click', () => onTransactionClick(tx));
        list.appendChild(item);
      }
    }

    function onTransactionClick(tx) {
      // Highlight in list
      document.querySelectorAll('.transaction-item').forEach(el => el.classList.remove('active'));
      const el = document.querySelector(`.transaction-item[data-id="${tx.id}"]`);
      if (el) el.classList.add('active');

      // Check if this transaction belongs to an excursion
      const excursionIdx = findExcursionForTimestamp(tx.createdAt);
      if (excursionIdx !== null) {
        selectTrip(excursionIdx);
        return;
      }

      // Find GPS position and snap map
      const pos = findPositionAtTime(tx.createdAt);
      if (!pos) return;
      const latlng = [pos.latitude, pos.longitude];
      setViewWithPanel(latlng, 17);

      // Show temporary highlight marker
      if (highlightMarker) map.removeLayer(highlightMarker);
      highlightMarker = L.circleMarker(latlng, {
        radius: 12, color: '#0891b2', fillColor: '#0891b2', fillOpacity: 0.3, weight: 2
      }).addTo(map);
      setTimeout(() => { if (highlightMarker) map.removeLayer(highlightMarker); highlightMarker = null; }, 5000);
    }

    function renderTransactionMarkers() {
      transactionMarkers.clearLayers();
      const spending = currentTransactions.filter(tx => parseFloat(tx.amount.value) < 0);
      for (const tx of spending) {
        const pos = findPositionAtTime(tx.createdAt);
        if (!pos) continue;
        const val = Math.abs(parseFloat(tx.amount.value));
        const icon = L.divIcon({
          className: '',
          html: '<div class="transaction-marker">$</div>',
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });
        const m = L.marker([pos.latitude, pos.longitude], { icon });
        m.bindTooltip(`${tx.description} — <span class="mono">$${val.toFixed(2)}</span>`, { direction: 'top', offset: [0, -12] });
        m.on('click', () => onMarkerTransactionClick(tx));
        transactionMarkers.addLayer(m);
      }
    }

    function onMarkerTransactionClick(tx) {
      // Highlight in list and scroll to it
      document.querySelectorAll('.transaction-item').forEach(el => el.classList.remove('active'));
      const el = document.querySelector(`.transaction-item[data-id="${tx.id}"]`);
      if (el) {
        el.classList.add('active');
        el.scrollIntoView({ block: 'nearest' });
      }

      // Navigate to excursion if applicable
      const excursionIdx = findExcursionForTimestamp(tx.createdAt);
      if (excursionIdx !== null) {
        selectTrip(excursionIdx);
      }
    }

    // --- Last.fm Listening Activity ---

    async function fetchListening(since, until) {
      return apiFetch(`/api/listening?since=${encodeURIComponent(since)}&until=${encodeURIComponent(until)}`);
    }

    async function loadListening() {
      if (trailPoints.length === 0) return;
      const listEl = document.getElementById('listening-list');
      try {
        const since = new Date(trailPoints[0].fixTime).toISOString();
        const until = new Date(trailPoints[trailPoints.length - 1].fixTime).toISOString();
        currentListening = await fetchListening(since, until);
        renderListening();
        renderListeningMarkers();
      } catch (e) {
        console.error('Listening loading failed:', e);
        listEl.innerHTML = '<div class="listening-loading">Failed to load listening.</div>';
      }
    }

    function renderListening() {
      const list = document.getElementById('listening-list');
      if (currentListening.length === 0) {
        list.innerHTML = '<div class="listening-loading">0 tracks.</div>';
        return;
      }
      list.innerHTML = '';
      for (const track of currentListening) {
        const item = document.createElement('div');
        item.className = 'listening-item';
        item.dataset.id = track.timestamp;
        const date = new Date(track.timestamp * 1000);
        const timeStr = date.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) + ' ' + formatTime(date);
        const locationLabel = getLocationLabel(date.toISOString());
        const spotifyQuery = encodeURIComponent(`${track.track} ${track.artist}`);
        const spotifyUrl = `https://open.spotify.com/search/${spotifyQuery}`;
        item.innerHTML = `
          <div class="listening-info">
            <div class="listening-track">${track.track}</div>
            <div class="listening-artist">${track.artist}</div>
            <div class="listening-time">${timeStr}</div>
            ${locationLabel ? `<div class="listening-location">${locationLabel}</div>` : ''}
          </div>
          <a class="listening-spotify" href="${spotifyUrl}" target="_blank" rel="noopener" title="Open in Spotify" onclick="event.stopPropagation()">Spotify</a>
        `;
        item.addEventListener('click', () => onListeningClick(track));
        list.appendChild(item);
      }
    }

    function renderListeningMarkers() {
      listeningMarkers.clearLayers();
      for (const track of currentListening) {
        const pos = findPositionAtTime(new Date(track.timestamp * 1000).toISOString());
        if (!pos) continue;
        const icon = L.divIcon({
          className: '',
          html: '<div class="listening-marker">♪</div>',
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });
        const m = L.marker([pos.latitude, pos.longitude], { icon });
        m.bindTooltip(`${track.artist} — ${track.track}`, { direction: 'top', offset: [0, -12] });
        m.on('click', () => onMarkerListeningClick(track));
        listeningMarkers.addLayer(m);
      }
    }

    function onListeningClick(track) {
      document.querySelectorAll('.listening-item').forEach(el => el.classList.remove('active'));
      const el = document.querySelector(`.listening-item[data-id="${track.timestamp}"]`);
      if (el) el.classList.add('active');

      // Check if this track belongs to an excursion
      const isoTime = new Date(track.timestamp * 1000).toISOString();
      const excursionIdx = findExcursionForTimestamp(isoTime);
      if (excursionIdx !== null) {
        selectTrip(excursionIdx);
        return;
      }

      const pos = findPositionAtTime(isoTime);
      if (!pos) return;
      const latlng = [pos.latitude, pos.longitude];
      setViewWithPanel(latlng, 17);

      if (highlightMarker) map.removeLayer(highlightMarker);
      highlightMarker = L.circleMarker(latlng, {
        radius: 12, color: '#0891b2', fillColor: '#0891b2', fillOpacity: 0.3, weight: 2
      }).addTo(map);
      setTimeout(() => { if (highlightMarker) map.removeLayer(highlightMarker); highlightMarker = null; }, 5000);
    }

    function onMarkerListeningClick(track) {
      document.querySelectorAll('.listening-item').forEach(el => el.classList.remove('active'));
      const el = document.querySelector(`.listening-item[data-id="${track.timestamp}"]`);
      if (el) {
        el.classList.add('active');
        el.scrollIntoView({ block: 'nearest' });
      }

      // Navigate to excursion if applicable
      const excursionIdx = findExcursionForTimestamp(new Date(track.timestamp * 1000).toISOString());
      if (excursionIdx !== null) {
        selectTrip(excursionIdx);
      }
    }

    // --- Trip loading and UI ---

    async function loadTrips() {
      try {
        const trips = await apiFetch('/api/trips');
        detectedTrips = trips.map(t => ({
          ...t,
          startTime: new Date(t.startTime),
          endTime: new Date(t.endTime)
        }));
        renderTripList();
      } catch (e) {
        console.error('Trip loading failed:', e);
        document.getElementById('trips-list').innerHTML = '<div class="trip-loading">Failed to load excursions.</div>';
      }
    }

    function renderTripList() {
      const list = document.getElementById('trips-list');
      if (detectedTrips.length === 0) {
        list.innerHTML = '<div class="trip-loading">0 excursions.</div>';
        return;
      }

      list.innerHTML = '';
      // Show newest first
      for (let i = detectedTrips.length - 1; i >= 0; i--) {
        const trip = detectedTrips[i];
        const item = document.createElement('div');
        item.className = 'trip-item' + (selectedTrip === i ? ' active' : '');
        item.innerHTML = `
          <div class="trip-date">${trip.date} Excursion #${trip.tripNum}</div>
          <div class="trip-time">${formatTime(trip.startTime)} – ${formatTime(trip.endTime)}</div>
        `;
        item.addEventListener('click', () => selectTrip(i));
        list.appendChild(item);
      }
    }

    function selectTrip(index) {
      currentMode = 'trip';
      selectedTrip = index;
      const trip = detectedTrips[index];

      drawTrail(trip.positions);
      fitBoundsWithPanel(trail.getBounds());

      renderTripList();
      document.getElementById('show-all-btn').style.display = 'block';
      loadTransactions();
      loadListening();
    }

    function showAll() {
      currentMode = 'duration';
      selectedTrip = null;
      firstLoad = true;
      document.getElementById('show-all-btn').style.display = 'none';
      renderTripList();
      updateTrail();
    }

    // --- Panel toggle ---
    const panel = document.getElementById('panel');
    const toggleBtn = document.getElementById('panel-toggle');
    toggleBtn.addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      toggleBtn.textContent = panel.classList.contains('collapsed') ? 'Show' : 'Hide';
    });

    // --- Duration tabs ---
    document.querySelectorAll('.duration-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (tab.dataset.duration === durationSetting) return;
        document.querySelectorAll('.duration-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        durationSetting = tab.dataset.duration;
        currentMode = 'duration';
        selectedTrip = null;
        firstLoad = true;
        document.getElementById('show-all-btn').style.display = 'none';
        renderTripList();
        updateTrail();
      });
    });

    // --- Show All button ---
    document.getElementById('show-all-btn').addEventListener('click', showAll);

    // --- Init ---
    updateTrail();
    setInterval(updateTrail, 120000);
    setInterval(updateLive, 5000);
    loadTrips();
    setInterval(loadTrips, 10 * 60 * 1000);

  </script>
</body>
</html>
