<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Ranker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens (bailey house style v1) ---------- */

:root {
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --accent: #0891b2;
  --accent-deep: #0e7490;
  --accent-ink: #ffffff;

  --r-ctl: 3px;
  --r-card: 4px;
  --sheen: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(0 0 0 / .08));

  /* light */
  --bg: #fafafa;
  --surface: #f1f1f3;
  --surface-2: #e9e9ed;
  --text: #131316;
  --text-2: #55555e;
  --muted: #9b9ba6;
  --line: #e4e4e9;
  --accent-text: #0e7490;
  --accent-soft: #e2f0f4;

  --danger: #b91c1c;

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0d;
    --surface: #17171a;
    --surface-2: #212126;
    --text: #f2f2f4;
    --text-2: #a3a3ad;
    --muted: #5b5b66;
    --line: #26262c;
    --accent-text: #3aa8c4;
    --accent-soft: #0c2229;
  }
}

:root[data-theme="dark"] {
  --bg: #0b0b0d;
  --surface: #17171a;
  --surface-2: #212126;
  --text: #f2f2f4;
  --text-2: #a3a3ad;
  --muted: #5b5b66;
  --line: #26262c;
  --accent-text: #3aa8c4;
  --accent-soft: #0c2229;
}

/* ---------- base ---------- */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top nav ---------- */

.nav { background: var(--accent-soft); }

.nav-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.wordmark {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  font-size: 18px;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
}

.nav-link {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
}
.nav-link:hover { color: var(--accent-text); }

/* ---------- layout ---------- */

.app {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px 64px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.view { display: none; flex: 1; }
.view.active { display: flex; flex-direction: column; }

/* ---------- buttons (labels are Title Case in markup) ---------- */

button {
  font-family: var(--font-body);
  cursor: pointer;
  border: none;
  background: none;
  font-size: 14px;
  color: var(--text);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  background-color: var(--surface);
  border-radius: var(--r-ctl);
  padding: 9px 16px;
  min-height: 38px;
}
.btn:hover { background-color: var(--surface-2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { background-color: var(--surface); }

.btn-primary {
  color: var(--accent-ink);
  background-color: var(--accent);
  background-image: var(--sheen);
}
.btn-primary:hover { background-color: var(--accent-deep); }
.btn-primary:disabled, .btn-primary:disabled:hover { background-color: var(--accent); }

.btn-danger { color: var(--danger); }

.btn-sm {
  padding: 5px 10px;
  min-height: 28px;
  font-size: 12.5px;
}

@media (pointer: coarse) {
  .btn { min-height: 44px; }
  .btn-sm { min-height: 36px; }
}

/* ---------- headings ---------- */

.section-title {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-size: clamp(26px, 6vw, 38px);
  margin-bottom: 6px;
}

.section-subtitle {
  color: var(--text-2);
  font-size: 13px;
  margin-bottom: 24px;
}

#compareSubtitle, #resultsSubtitle {
  font-family: var(--font-mono);
  font-size: 12.5px;
}

/* ---------- inputs ---------- */

input[type="text"], textarea {
  width: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text);
  background: var(--surface);
  border: none;
  border-radius: var(--r-ctl);
  padding: 9px 12px;
  min-height: 38px;
}
input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
input[type="text"]:focus, textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

textarea { resize: vertical; min-height: 120px; }

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 6px;
}

/* ---------- setup view ---------- */

.input-group { margin-bottom: 20px; }

.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; }
.add-row .btn { flex-shrink: 0; }

#bulkAddRow .btn { margin-top: 8px; }
#bulkToggle { margin-top: 8px; }

.item-list {
  list-style: none;
  margin-top: 8px;
  margin-bottom: 24px;
}

.item-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 2px;
  border-bottom: 1px solid var(--line);
}
.item-entry .item-name { font-size: 14px; }
.item-entry .item-num {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  min-width: 22px;
  margin-right: 8px;
  text-align: right;
}

.item-empty {
  list-style: none;
  color: var(--text-2);
  font-size: 14px;
  padding: 9px 2px;
}

.setup-footer {
  margin-top: auto;
  padding: 20px 0;
  display: flex;
  justify-content: flex-end;
}

/* ---------- resume banner ---------- */

.resume-banner {
  padding: 14px;
  background: var(--surface);
  border-radius: var(--r-card);
  margin-bottom: 20px;
}
.resume-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.resume-name { font-weight: 600; font-size: 14px; }
.resume-info {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-2);
}
.resume-actions { display: flex; gap: 6px; }
.resume-banner .btn { background-color: var(--surface-2); }
.resume-banner .btn:hover { background-color: var(--surface-2); }
.resume-banner .btn-primary { background-color: var(--accent); }
.resume-banner .btn-primary:hover { background-color: var(--accent-deep); }

/* ---------- compare view ---------- */

.compare-header { margin-bottom: 24px; }

.compare-progress {
  width: 100%;
  height: 4px;
  background: var(--surface-2);
  margin-top: 12px;
  overflow: hidden;
}
.compare-progress-bar {
  height: 100%;
  background: var(--accent);
}

.compare-arena {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 0;
}

.compare-card {
  width: 100%;
  padding: 28px 20px;
  background-color: var(--surface);
  border-radius: var(--r-card);
  text-align: center;
  cursor: pointer;
}
.compare-card:hover { background-color: var(--surface-2); }

.compare-card .card-name {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.02em;
  font-size: 20px;
  color: var(--text);
}

.compare-card.chosen {
  background-color: var(--accent);
  background-image: var(--sheen);
}
.compare-card.chosen .card-name { color: var(--accent-ink); }

.compare-vs {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}

.compare-footer {
  padding: 16px 0 24px;
  display: flex;
  justify-content: center;
}

/* ---------- results view ---------- */

.results-list {
  list-style: none;
  margin-bottom: 24px;
}

.result-item {
  display: flex;
  align-items: center;
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
}

.result-rank {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-2);
  width: 36px;
  padding-right: 12px;
  text-align: right;
  flex-shrink: 0;
}

.result-name { font-size: 14.5px; }

.result-item:first-child { background: var(--accent-soft); }
.result-item:first-child .result-rank { color: var(--accent-text); font-weight: 700; }
.result-item:first-child .result-name { font-weight: 600; }

.results-footer {
  margin-top: auto;
  padding: 20px 0;
  display: flex;
  gap: 8px;
  justify-content: center;
}

/* ---------- history view ---------- */

.history-empty {
  color: var(--text-2);
  font-size: 14px;
  padding: 24px 0;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 24px;
}

.history-card {
  background: var(--surface);
  border-radius: var(--r-card);
  padding: 14px;
  cursor: pointer;
}
.history-card:hover { background: var(--surface-2); }

.history-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 6px;
}

.history-card-title {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.02em;
  font-size: 15px;
}

.history-card-date {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
  margin-left: 12px;
}

.history-card-items {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
}

.history-card-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.history-card .btn { background-color: var(--bg); }
.history-card .btn:hover { background-color: var(--surface-2); }

.history-detail-back { margin-bottom: 16px; }
.history-detail-actions { display: flex; gap: 8px; padding-bottom: 32px; }

/* ---------- undo toast ---------- */

.undo-indicator {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: var(--r-ctl);
  display: none;
  pointer-events: none;
  z-index: 10;
}
.undo-indicator.show { display: block; }

/* ---------- signature ---------- */

.b-glyph {
  position: fixed;
  bottom: 10px;
  right: 10px;
  z-index: 90;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
  line-height: 1;
  color: var(--text-2);
  background: var(--surface);
  border-radius: var(--r-ctl);
  padding: 6px 8px;
  text-decoration: none;
}
.b-glyph:hover { color: var(--accent-text); }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="wordmark" onclick="goHome()">ranker</a>
    <button class="nav-link" onclick="showHistory()" id="historyBtn">History</button>
  </div>
</header>

<div class="app">
  <!-- SETUP VIEW -->
  <div class="view active" id="setupView">
    <div id="resumeBanner" class="resume-banner" style="display:none">
      <div class="resume-row">
        <div>
          <div class="resume-name" id="resumeName"></div>
          <div class="resume-info" id="resumeInfo"></div>
        </div>
        <div class="resume-actions">
          <button class="btn btn-sm btn-primary" onclick="resumeSession()">Resume</button>
          <button class="btn btn-sm" onclick="dismissResume()">Dismiss</button>
        </div>
      </div>
    </div>
    <div class="section-title">Set up your ranking</div>
    <div class="section-subtitle">Name your ranking and add at least two items to compare.</div>

    <div class="input-group">
      <label>Ranking Name</label>
      <input type="text" id="rankingName" placeholder="e.g. Best pizza toppings" autocomplete="off">
    </div>

    <div class="input-group">
      <label>Add Items</label>
      <div class="add-row" id="singleAddRow">
        <input type="text" id="itemInput" placeholder="Type an item and press Enter" autocomplete="off">
        <button class="btn" onclick="addItem()">Add</button>
      </div>
      <div id="bulkAddRow" style="display:none">
        <textarea id="bulkInput" placeholder="One item per line" rows="6"></textarea>
        <button class="btn" onclick="addBulkItems()">Add All</button>
      </div>
      <button class="btn btn-sm" onclick="toggleBulkMode()" id="bulkToggle">Bulk Add</button>
    </div>

    <ul class="item-list" id="itemList"></ul>

    <div class="setup-footer">
      <button class="btn btn-primary" id="startBtn" disabled onclick="startRanking()">Start Ranking</button>
    </div>
  </div>

  <!-- COMPARE VIEW -->
  <div class="view" id="compareView">
    <div class="compare-header">
      <div class="section-title" id="compareTitleEl">Which do you prefer?</div>
      <div class="section-subtitle" id="compareSubtitle"></div>
      <div class="compare-progress">
        <div class="compare-progress-bar" id="progressBar" style="width: 0%"></div>
      </div>
    </div>

    <div class="compare-arena">
      <div class="compare-card" id="cardLeft" onclick="choose('left')">
        <span class="card-name" id="leftName"></span>
      </div>
      <div class="compare-vs">vs</div>
      <div class="compare-card" id="cardRight" onclick="choose('right')">
        <span class="card-name" id="rightName"></span>
      </div>
    </div>

    <div class="compare-footer">
      <button class="btn" id="undoBtn" onclick="undoChoice()" disabled>Undo</button>
    </div>
  </div>

  <!-- RESULTS VIEW -->
  <div class="view" id="resultsView">
    <div class="section-title" id="resultsTitleEl">Your ranking</div>
    <div class="section-subtitle" id="resultsSubtitle"></div>

    <ol class="results-list" id="resultsList"></ol>

    <div class="results-footer">
      <button class="btn" onclick="rerank()">Re-Rank</button>
      <button class="btn btn-primary" onclick="saveAndDone()">Save &amp; Done</button>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="historyView">
    <div class="section-title">History</div>
    <div class="section-subtitle">Your previous rankings.</div>

    <div id="historyContent"></div>
  </div>
</div>

<div class="undo-indicator" id="undoToast">Undone.</div>

<a class="b-glyph" href="https://index.baileys.app" title="A Bailey App">b.</a>

<script>
// ─── State ───
let items = [];
let ranker = null;
let currentRankingName = '';
let currentResult = null;

// ─── Merge Sort Ranker ───
class MergeSortRanker {
  constructor(items) {
    // Shuffle for fairness
    this.original = [...items];
    const shuffled = [...items];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    this.runs = shuffled.map(item => [item]);
    this.nextRuns = [];
    this.pairIndex = 0;
    this.left = null;
    this.right = null;
    this.leftIdx = 0;
    this.rightIdx = 0;
    this.merged = [];
    this.history = [];
    this.done = false;
    this.result = null;
    this.completedComparisons = 0;

    // Worst-case comparisons estimate
    const n = items.length;
    this.maxComparisons = Math.max(1, Math.ceil(n * Math.log2(n || 1)));

    this._advance();
  }

  _advance() {
    // Continue current merge if both sides have elements
    if (this.left && this.right) {
      if (this.leftIdx < this.left.length && this.rightIdx < this.right.length) {
        return; // need user input
      }
      // Exhaust remaining
      while (this.leftIdx < this.left.length) this.merged.push(this.left[this.leftIdx++]);
      while (this.rightIdx < this.right.length) this.merged.push(this.right[this.rightIdx++]);
      this.nextRuns.push([...this.merged]);
      this.pairIndex += 2;
    }

    // Find next pair to merge
    while (this.pairIndex < this.runs.length) {
      if (this.pairIndex + 1 < this.runs.length) {
        this.left = this.runs[this.pairIndex];
        this.right = this.runs[this.pairIndex + 1];
        this.leftIdx = 0;
        this.rightIdx = 0;
        this.merged = [];
        return; // need user input
      } else {
        this.nextRuns.push([...this.runs[this.pairIndex]]);
        this.pairIndex += 2;
      }
    }

    // Pass complete
    if (this.nextRuns.length <= 1) {
      this.done = true;
      this.result = this.nextRuns[0] || [];
      return;
    }

    this.runs = [...this.nextRuns];
    this.nextRuns = [];
    this.pairIndex = 0;
    this.left = null;
    this.right = null;
    this._advance();
  }

  getPair() {
    if (this.done) return null;
    return [this.left[this.leftIdx], this.right[this.rightIdx]];
  }

  choose(side) {
    this.history.push({
      runs: JSON.parse(JSON.stringify(this.runs)),
      nextRuns: JSON.parse(JSON.stringify(this.nextRuns)),
      pairIndex: this.pairIndex,
      left: [...this.left],
      right: [...this.right],
      leftIdx: this.leftIdx,
      rightIdx: this.rightIdx,
      merged: [...this.merged],
      completedComparisons: this.completedComparisons
    });

    if (side === 'left') {
      this.merged.push(this.left[this.leftIdx++]);
    } else {
      this.merged.push(this.right[this.rightIdx++]);
    }
    this.completedComparisons++;
    this._advance();
  }

  undo() {
    if (!this.history.length) return false;
    const s = this.history.pop();
    this.runs = s.runs;
    this.nextRuns = s.nextRuns;
    this.pairIndex = s.pairIndex;
    this.left = s.left;
    this.right = s.right;
    this.leftIdx = s.leftIdx;
    this.rightIdx = s.rightIdx;
    this.merged = s.merged;
    this.completedComparisons = s.completedComparisons;
    this.done = false;
    this.result = null;
    return true;
  }

  get canUndo() { return this.history.length > 0; }
  get progress() { return Math.min(1, this.completedComparisons / this.maxComparisons); }
}

// ─── View Management ───
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── Setup ───
const itemInput = document.getElementById('itemInput');
const rankingNameInput = document.getElementById('rankingName');
const startBtn = document.getElementById('startBtn');

function renderItems() {
  const list = document.getElementById('itemList');
  if (!items.length) {
    list.innerHTML = '<li class="item-empty">0 items.</li>';
  } else {
    list.innerHTML = items.map((item, i) => `
      <li class="item-entry">
        <div style="display:flex;align-items:center">
          <span class="item-num">${i + 1}</span>
          <span class="item-name">${esc(item)}</span>
        </div>
        <button class="btn btn-sm remove-btn" onclick="removeItem(${i})">Remove</button>
      </li>
    `).join('');
  }
  startBtn.disabled = items.length < 2;
}

function addItem() {
  const val = itemInput.value.trim();
  if (!val) return;
  if (items.includes(val)) { itemInput.select(); return; }
  items.push(val);
  itemInput.value = '';
  itemInput.focus();
  renderItems();
}

function removeItem(i) {
  items.splice(i, 1);
  renderItems();
}

itemInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addItem(); }
});

function startRanking() {
  if (items.length < 2) return;
  currentRankingName = rankingNameInput.value.trim() || 'Untitled ranking';
  ranker = new MergeSortRanker(items);
  saveSession();
  showView('compareView');
  renderComparison();
}

// ─── Compare ───
function renderComparison() {
  if (ranker.done) {
    currentResult = ranker.result;
    showResults();
    return;
  }
  const [a, b] = ranker.getPair();
  document.getElementById('leftName').textContent = a;
  document.getElementById('rightName').textContent = b;
  document.getElementById('compareSubtitle').textContent =
    `Comparison ${ranker.completedComparisons + 1}.`;
  document.getElementById('progressBar').style.width =
    `${Math.round(ranker.progress * 100)}%`;
  document.getElementById('undoBtn').disabled = !ranker.canUndo;

  // Reset card states
  document.getElementById('cardLeft').classList.remove('chosen');
  document.getElementById('cardRight').classList.remove('chosen');
}

function choose(side) {
  const card = document.getElementById(side === 'left' ? 'cardLeft' : 'cardRight');
  card.classList.add('chosen');

  setTimeout(() => {
    ranker.choose(side);
    saveSession();
    renderComparison();
  }, 180);
}

function undoChoice() {
  if (ranker.undo()) {
    saveSession();
    renderComparison();
    // Show toast
    const toast = document.getElementById('undoToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1200);
  }
}

// Keyboard shortcuts for compare
document.addEventListener('keydown', e => {
  if (!document.getElementById('compareView').classList.contains('active')) return;
  if (e.key === 'ArrowLeft' || e.key === '1') choose('left');
  else if (e.key === 'ArrowRight' || e.key === '2') choose('right');
  else if ((e.key === 'z' && (e.metaKey || e.ctrlKey)) || e.key === 'Backspace') {
    e.preventDefault();
    undoChoice();
  }
});

// ─── Results ───
function showResults() {
  showView('resultsView');
  document.getElementById('resultsTitleEl').textContent = currentRankingName;
  document.getElementById('resultsSubtitle').textContent =
    `${currentResult.length} items. ${ranker.completedComparisons} comparisons.`;

  const list = document.getElementById('resultsList');
  list.innerHTML = currentResult.map((item, i) => `
    <li class="result-item">
      <span class="result-rank">${i + 1}</span>
      <span class="result-name">${esc(item)}</span>
    </li>
  `).join('');
}

function rerank() {
  ranker = new MergeSortRanker(items);
  showView('compareView');
  renderComparison();
}

function saveAndDone() {
  const history = getHistory();
  history.unshift({
    id: Date.now(),
    name: currentRankingName,
    date: new Date().toISOString(),
    items: [...items],
    result: [...currentResult],
    comparisons: ranker.completedComparisons
  });
  localStorage.setItem('ranker_history', JSON.stringify(history));
  clearSession();
  showHistory();
}

// ─── History ───
function getHistory() {
  try { return JSON.parse(localStorage.getItem('ranker_history')) || []; }
  catch { return []; }
}

function showHistory() {
  showView('historyView');
  const history = getHistory();
  const content = document.getElementById('historyContent');

  if (!history.length) {
    content.innerHTML = '<div class="history-empty">0 rankings.</div>';
    return;
  }

  content.innerHTML = '<div class="history-list">' + history.map((h, idx) => `
    <div class="history-card" onclick="viewHistoryDetail(${idx})">
      <div class="history-card-header">
        <div class="history-card-title">${esc(h.name)}</div>
        <div class="history-card-date">${formatDate(h.date)}</div>
      </div>
      <div class="history-card-items">${h.result.slice(0, 5).map((r, i) => `${i + 1}. ${esc(r)}`).join(' &middot; ')}${h.result.length > 5 ? ' &hellip;' : ''}</div>
      <div class="history-card-items" style="margin-top:2px">${h.comparisons != null ? h.comparisons + ' comparisons.' : ''}</div>
      <div class="history-card-actions">
        <button class="btn btn-sm" onclick="event.stopPropagation(); rerankFromHistory(${idx})">Re-Rank</button>
        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteHistory(${idx})">Delete</button>
      </div>
    </div>
  `).join('') + '</div>';
}

function viewHistoryDetail(idx) {
  const history = getHistory();
  const h = history[idx];
  const content = document.getElementById('historyContent');

  content.innerHTML = `
    <button class="btn btn-sm history-detail-back" onclick="showHistory()">Back</button>
    <div class="section-title" style="margin-bottom:4px">${esc(h.name)}</div>
    <div class="section-subtitle">${formatDate(h.date)} &middot; ${h.result.length} items${h.comparisons != null ? ' &middot; ' + h.comparisons + ' comparisons' : ''}</div>
    <ol class="results-list">
      ${h.result.map((item, i) => `
        <li class="result-item">
          <span class="result-rank">${i + 1}</span>
          <span class="result-name">${esc(item)}</span>
        </li>
      `).join('')}
    </ol>
    <div class="history-detail-actions">
      <button class="btn" onclick="rerankFromHistory(${idx})">Re-Rank</button>
    </div>
  `;
}

function rerankFromHistory(idx) {
  const history = getHistory();
  const h = history[idx];
  items = [...h.items];
  currentRankingName = h.name;
  rankingNameInput.value = h.name;
  renderItems();
  ranker = new MergeSortRanker(items);
  showView('compareView');
  renderComparison();
}

function deleteHistory(idx) {
  const history = getHistory();
  history.splice(idx, 1);
  localStorage.setItem('ranker_history', JSON.stringify(history));
  showHistory();
}

function goHome() {
  items = [];
  currentResult = null;
  ranker = null;
  clearSession();
  rankingNameInput.value = '';
  renderItems();
  showView('setupView');
  rankingNameInput.focus();
}

// ─── Bulk Add ───
let bulkMode = false;
function toggleBulkMode() {
  bulkMode = !bulkMode;
  document.getElementById('singleAddRow').style.display = bulkMode ? 'none' : 'flex';
  document.getElementById('bulkAddRow').style.display = bulkMode ? 'block' : 'none';
  document.getElementById('bulkToggle').textContent = bulkMode ? 'Single Add' : 'Bulk Add';
  if (bulkMode) document.getElementById('bulkInput').focus();
  else itemInput.focus();
}

function addBulkItems() {
  const text = document.getElementById('bulkInput').value;
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let added = 0;
  for (const line of lines) {
    if (!items.includes(line)) {
      items.push(line);
      added++;
    }
  }
  document.getElementById('bulkInput').value = '';
  renderItems();
  if (added > 0) toggleBulkMode();
}

// ─── Session Persistence ───
function saveSession() {
  const session = {
    name: currentRankingName,
    items: items,
    ranker: {
      original: ranker.original,
      runs: ranker.runs,
      nextRuns: ranker.nextRuns,
      pairIndex: ranker.pairIndex,
      left: ranker.left,
      right: ranker.right,
      leftIdx: ranker.leftIdx,
      rightIdx: ranker.rightIdx,
      merged: ranker.merged,
      history: ranker.history,
      done: ranker.done,
      result: ranker.result,
      completedComparisons: ranker.completedComparisons,
      maxComparisons: ranker.maxComparisons
    }
  };
  localStorage.setItem('ranker_session', JSON.stringify(session));
}

function clearSession() {
  localStorage.removeItem('ranker_session');
}

function loadSession() {
  try {
    const data = JSON.parse(localStorage.getItem('ranker_session'));
    if (!data || !data.ranker) return null;
    return data;
  } catch { return null; }
}

function resumeSession() {
  const session = loadSession();
  if (!session) return;
  items = session.items;
  currentRankingName = session.name;
  rankingNameInput.value = session.name;
  renderItems();

  // Reconstruct ranker without running constructor logic
  ranker = Object.create(MergeSortRanker.prototype);
  const s = session.ranker;
  ranker.original = s.original;
  ranker.runs = s.runs;
  ranker.nextRuns = s.nextRuns;
  ranker.pairIndex = s.pairIndex;
  ranker.left = s.left;
  ranker.right = s.right;
  ranker.leftIdx = s.leftIdx;
  ranker.rightIdx = s.rightIdx;
  ranker.merged = s.merged;
  ranker.history = s.history;
  ranker.done = s.done;
  ranker.result = s.result;
  ranker.completedComparisons = s.completedComparisons;
  ranker.maxComparisons = s.maxComparisons;

  if (ranker.done) {
    currentResult = ranker.result;
    showResults();
  } else {
    showView('compareView');
    renderComparison();
  }
}

// ─── Helpers ───
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function dismissResume() {
  clearSession();
  document.getElementById('resumeBanner').style.display = 'none';
}

// ─── Init ───
(function init() {
  const session = loadSession();
  if (session) {
    const banner = document.getElementById('resumeBanner');
    document.getElementById('resumeName').textContent = session.name || 'Untitled ranking';
    const comp = session.ranker.completedComparisons;
    const total = session.ranker.maxComparisons;
    document.getElementById('resumeInfo').textContent =
      `${session.items.length} items · ${comp}/${total} comparisons`;
    banner.style.display = 'block';
  }
})();

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  if (diff < 604800000) return `${Math.floor(diff / 86400000)}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}
