{{define "title"}}catch — sign in{{end}}

{{define "content"}}
<h1>catch</h1>
<p class="lede">A webhook and request inspector. Everything except the capture endpoints needs the token.</p>

<section class="card narrow">
  <h2 class="card-title">Token</h2>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <div class="field">
      <label for="token">App Token</label>
      <input type="password" id="token" name="token" autocomplete="current-password" autofocus>
    </div>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <button class="btn primary" type="submit">Sign In</button>
  </form>
  <p class="note">Scripts can skip this and send <span class="mono">Authorization: Bearer &lt;token&gt;</span>.</p>
</section>
{{end}}
