<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pool Physics — billiards sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="table"></canvas>

  <header class="hud hud-top">
    <div class="brand">
      <div>
        <h1>pool physics</h1>
        <p class="brand-sub">elastic collision sandbox</p>
      </div>
    </div>
    <dl class="readout" aria-label="live state">
      <div><dt>Balls</dt><dd id="stat-balls">0</dd></div>
      <div><dt>Kinetic Energy</dt><dd id="stat-ke">0.00</dd></div>
      <div><dt>|Momentum|</dt><dd id="stat-p">0.00</dd></div>
    </dl>
  </header>

  <aside class="hud hud-hint" id="hint">
    <kbd>Click</kbd> place a ball &nbsp;·&nbsp; <kbd>Drag</kbd> from a ball to launch &nbsp;·&nbsp; <kbd>Shift</kbd>+<kbd>Click</kbd> remove
  </aside>

  <footer class="hud hud-bottom">
    <div class="control">
      <label for="mass">Mass</label>
      <input type="range" id="mass" min="1" max="10" step="0.5" value="2">
      <output id="mass-val">2.0</output>
    </div>

    <div class="control">
      <label for="restitution">Elasticity</label>
      <input type="range" id="restitution" min="0.5" max="1" step="0.01" value="0.97">
      <output id="restitution-val">0.97</output>
    </div>

    <div class="toggles">
      <label class="toggle">
        <input type="checkbox" id="friction" checked>
        <span>Friction</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="vectors">
        <span>Vectors</span>
      </label>
      <label class="toggle" title="Render every other frame to reduce CPU load">
        <input type="checkbox" id="eco">
        <span>Eco</span>
      </label>
    </div>

    <div class="actions">
      <div class="layout-picker">
        <button id="layouts-btn" class="btn btn-ghost" type="button" aria-haspopup="true" aria-expanded="false">Layouts <span class="caret">▾</span></button>
        <div class="layout-menu" id="layout-menu" hidden role="menu">
          <button data-layout="rack" type="button" role="menuitem">Rack</button>
          <button data-layout="grid" type="button" role="menuitem">Grid</button>
          <button data-layout="line" type="button" role="menuitem">Line</button>
          <button data-layout="wall" type="button" role="menuitem">Wall</button>
          <button data-layout="cluster" type="button" role="menuitem">Cluster</button>
          <button data-layout="swarm" type="button" role="menuitem">Swarm</button>
          <button data-layout="giants" type="button" role="menuitem">Giants</button>
          <button data-layout="rings" type="button" role="menuitem">Rings</button>
          <button data-layout="double" type="button" role="menuitem">Double</button>
          <button data-layout="cross" type="button" role="menuitem">Cross</button>
          <button data-layout="funnel" type="button" role="menuitem">Funnel</button>
          <button data-layout="cradle" type="button" role="menuitem">Cradle</button>
          <button data-layout="pendulum" type="button" role="menuitem">Pendulum</button>
          <button data-layout="chaos" type="button" role="menuitem">Chaos</button>
        </div>
      </div>
      <button id="clear" class="btn btn-ghost" type="button">Clear</button>
    </div>
  </footer>

  <a class="b-glyph" href="https://index.baileys.app" title="A Bailey App">b.</a>

  <script src="script.js"></script>
</body>
</html>
