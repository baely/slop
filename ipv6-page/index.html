<style>
/* ---------- tokens (house style v1) ---------- */
:root {
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --accent: #0891b2;
  --accent-deep: #0e7490;
  --accent-ink: #ffffff;

  --r-ctl: 3px;
  --r-card: 4px;
  --sheen: linear-gradient(180deg, rgb(255 255 255 / .12), rgb(0 0 0 / .08));

  /* light */
  --bg: #fafafa;
  --surface: #f1f1f3;
  --surface-2: #e9e9ed;
  --text: #131316;
  --text-2: #55555e;
  --muted: #9b9ba6;
  --line: #e4e4e9;
  --accent-text: #0e7490;
  --accent-soft: #e2f0f4;

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0d;
    --surface: #17171a;
    --surface-2: #212126;
    --text: #f2f2f4;
    --text-2: #a3a3ad;
    --muted: #5b5b66;
    --line: #26262c;
    --accent-text: #3aa8c4;
    --accent-soft: #0c2229;
  }
}

/* ---------- page ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 40px 24px;
}

main {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
}

.wordmark {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-size: clamp(30px, 8vw, 40px);
  color: var(--text);
  margin-bottom: 16px;
}

p {
  color: var(--text-2);
  max-width: 46ch;
  margin-bottom: 24px;
}

.addrs {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.addrs a {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--accent-text);
  text-decoration: none;
  word-break: break-all;
}
.addrs a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- signature ---------- */
.b-glyph {
  position: fixed;
  bottom: 10px;
  right: 10px;
  z-index: 90;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
  line-height: 1;
  color: var(--text-2);
  background: var(--surface);
  border-radius: var(--r-ctl);
  padding: 6px 8px;
  text-decoration: none;
}
.b-glyph:hover { color: var(--accent-text); }
</style>
</head>

</main>
